<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Isolated Inventory Engine</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.04);
            --dark: #0a0a0c;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: var(--dark); 
            color: white; 
            margin: 0; 
            padding: 24px;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        h2 { margin: 0; font-weight: 800; letter-spacing: 1.5px; color: #fff; font-size: 1.4rem; }
        
        select {
            width: 180px; padding: 10px 14px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15); 
            color: white; border-radius: 8px; outline: none; transition: 0.2s; font-size: 0.85rem;
        }
        select:focus { border-color: var(--neon-cyan); }

        .panel { 
            background: var(--glass); padding: 24px; border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(20px); 
        }
        
        .grid-table { width: 100%; border-collapse: collapse; }
        .grid-table th { color: var(--neon-cyan); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        .grid-table td { padding: 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.9rem; }
        .grid-table tr:hover { background: rgba(255, 255, 255, 0.01); }

        .btn {
            padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.3px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-approve { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.2); }
        .btn-approve:hover { background: #00ff88; color: #000; }
        .btn-primary { background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); border: 1px solid rgba(0, 243, 255, 0.2); }
        .btn-primary:hover { background: var(--neon-cyan); color: #000; }
        .btn-danger { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.2); }
        .btn-danger:hover { background: #ff4d4d; color: #fff; }

        .low-stock { color: #ffcc00; font-weight: bold; animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        /* Dialog UI Overlay */
        #confirm-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 11000;
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: #111116; border: 1px solid rgba(255, 77, 77, 0.3); padding: 24px;
            border-radius: 12px; max-width: 360px; width: 100%; text-align: center;
        }
        .modal-box p { font-size: 0.9rem; color: #ccc; margin-bottom: 20px; line-height: 1.4; }
        .modal-flex { display: flex; gap: 10px; justify-content: center; }

        /* Toast Component */
        .toast-notification {
            position: fixed; bottom: 24px; right: 24px;
            background: rgba(10, 10, 12, 0.95); border: 1px solid var(--neon-cyan);
            padding: 14px 24px; border-radius: 12px; color: #fff;
            font-size: 0.85rem; font-weight: 500; z-index: 10000;
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15);
            opacity: 0; pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            transform: translateY(20px);
        }
        .toast-notification.active { opacity: 1; transform: translateY(0); }
        .toast-notification.error-toast { border-color: #ff4d4d; box-shadow: 0 8px 32px rgba(255, 77, 77, 0.15); }

        /* State Modifiers */
        .loading-view { text-align: center; color: #666; font-size: 0.9rem; padding: 40px 0; }
        .empty-view { text-align: center; color: #555; font-size: 0.85rem; padding: 40px 0; display: none; }
    </style>
</head>
<body>

    <div id="confirm-modal">
        <div class="modal-box">
            <h3 style="color:#ff4d4d; margin:0 0 10px 0; font-size:1.1rem;">Confirm Destruction</h3>
            <p id="modal-text">Are you sure you want to delete this asset permanently?</p>
            <div class="modal-flex">
                <button class="btn btn-danger" id="modal-confirm-btn">DELETE</button>
                <button class="btn" style="background:rgba(255,255,255,0.06); color:#fff;" id="modal-close-btn">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-notification"></div>

    <div class="header-area">
        <div>
            <h2>Inventory Engine</h2>
            <div style="font-size: 0.7rem; color: #555; margin-top: 4px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Active Isolated Processing Grid</div>
        </div>
        <select id="view-filter">
            <option value="ALL">All Assets</option>
            <option value="LOW">⚠️ Low Stock (&lt;3)</option>
            <option value="Logs">🚀 Logs</option>
            <option value="Working Pics">📂 Working Pics</option>
            <option value="Websites">🌐 Websites</option>
            <option value="VPNs and TV">🔐 VPNs/TV</option>
            <option value="iCloud"> iCloud</option>
            <option value="FMT and Updates">📝 FMT & Updates</option>
            <option value="Tools">🛠️ TOOLS</option>
            <option value="Bots">🤖 Bots</option>
            <option value="Freebies">🎁 FREE ZONE</option>
        </select>
    </div>

    <div class="panel">
        <table class="grid-table">
            <thead>
                <tr>
                    <th>Asset Details</th>
                    <th>Price</th>
                    <th>Available Stock</th>
                    <th>Control Operations</th>
                </tr>
            </thead>
            <tbody id="inventory-rows">
                <tr id="initial-loading-row"><td colspan="4" class="loading-view">Synchronizing data stream parameters...</td></tr>
            </tbody>
        </table>
        <div id="empty-notice" class="empty-view">No marketplace configurations discovered matching parameters.</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tbody = document.getElementById('inventory-rows');
        const emptyNotice = document.getElementById('empty-notice');
        const filterEl = document.getElementById('view-filter');
        const toastContainer = document.getElementById('toast-container');
        const confirmModal = document.getElementById('confirm-modal');
        
        let inventoryUnsubscribe = null;
        let toastTimeout;
        let pendingDeleteId = null;

        function showNotification(msg, isError = false) {
            clearTimeout(toastTimeout);
            toastContainer.innerText = msg;
            if(isError) toastContainer.classList.add('error-toast');
            else toastContainer.classList.remove('error-toast');
            toastContainer.classList.add('active');
            toastTimeout = setTimeout(() => toastContainer.classList.remove('active'), 3500);
        }

        function createRowElement(id, p) {
            const tr = document.createElement('tr');
            tr.id = `prod-row-${id}`;
            tr.setAttribute('data-category', p.category || '');
            tr.setAttribute('data-stockcount', p.stockCount ?? 0);
            tr.setAttribute('data-mode', p.mode || 'MULTIPLE');
            updateRowContents(tr, id, p);
            return tr;
        }

        function updateRowContents(tr, id, p) {
            const priceStr = (p.price !== undefined) ? p.price.toLocaleString() : '0';
            const isLowStock = p.stockCount < 3 && p.mode !== 'SINGLE';
            const stockClass = isLowStock ? 'low-stock' : '';
            const stockDisplay = p.mode === 'SINGLE' ? '∞' : (p.stockCount ?? 0);
            
            tr.innerHTML = `
                <td><strong>${p.name || 'Unnamed Asset'}</strong><br><small style="color:#666">${p.category || 'Uncategorized'}</small></td>
                <td>₦${priceStr}</td>
                <td class="${stockClass}">${stockDisplay}</td>
                <td>
                    <button class="btn btn-approve" id="edit-${id}">EDIT</button>
                    <button class="btn btn-primary" id="link-${id}">🔗 Link</button>
                    <button class="btn btn-danger" id="del-${id}">Del</button>
                </td>
            `;

            // Micro-optimized inline pointer handlers to completely eliminate raw global state strings
            tr.querySelector(`#edit-${id}`).addEventListener('click', () => editProduct(id));
            tr.querySelector(`#link-${id}`).addEventListener('click', () => copyDirectLink(id));
            tr.querySelector(`#del-${id}`).addEventListener('click', () => deleteAssetRequest(id));
        }

        function applyFilterState() {
            const filter = filterEl.value;
            const rows = tbody.querySelectorAll('tr:not(#initial-loading-row)');
            let structuralCount = 0;

            rows.forEach(row => {
                const cat = row.getAttribute('data-category');
                const count = parseInt(row.getAttribute('data-stockcount'), 10);
                const mode = row.getAttribute('data-mode');

                let displayStatus = true;
                if(filter === 'LOW') {
                    if(mode === 'SINGLE' || count >= 3) displayStatus = false;
                } else if(filter !== 'ALL' && cat !== filter) {
                    displayStatus = false;
                }

                if(displayStatus) {
                    row.style.display = "";
                    structuralCount++;
                } else {
                    row.style.display = "none";
                }
            });

            emptyNotice.style.display = structuralCount === 0 ? "block" : "none";
        }

        function loadInventory() {
            if (inventoryUnsubscribe) {
                inventoryUnsubscribe();
            }

            inventoryUnsubscribe = onSnapshot(collection(db, "products"), (snap) => {
                const loadingRow = document.getElementById('initial-loading-row');
                if (loadingRow) loadingRow.remove();

                snap.docChanges().forEach(change => {
                    const id = change.doc.id;
                    const p = change.doc.data();

                    if (change.type === "added") {
                        if (!document.getElementById(`prod-row-${id}`)) {
                            const newRow = createRowElement(id, p);
                            tbody.appendChild(newRow);
                        }
                    }
                    else if (change.type === "modified") {
                        const existingRow = document.getElementById(`prod-row-${id}`);
                        if (existingRow) {
                            existingRow.setAttribute('data-category', p.category || '');
                            existingRow.setAttribute('data-stockcount', p.stockCount ?? 0);
                            existingRow.setAttribute('data-mode', p.mode || 'MULTIPLE');
                            updateRowContents(existingRow, id, p);
                        }
                    }
                    else if (change.type === "removed") {
                        const existingRow = document.getElementById(`prod-row-${id}`);
                        if (existingRow) existingRow.remove();
                    }
                });

                applyFilterState();
            }, (err) => {
                showNotification("Database dynamic connection lost. Try refreshing.", true);
            });
        }

        function editProduct(id) {
            // Smooth tab allocation redirecting the active state payload directly to deployment dashboard core file
            window.location.href = `adminq.html?editProduct=${id}`;
        }

        function copyDirectLink(id) {
            const baseUrl = window.location.origin + window.location.pathname.replace('inventory.html', 'buy.html');
            const fullLink = `${baseUrl}?id=${id}`;
            navigator.clipboard.writeText(fullLink).then(() => {
                showNotification("Product destination link copied!");
            }).catch(() => {
                showNotification("Link tracking profile: " + fullLink, false);
            });
        }

        function deleteAssetRequest(id) {
            pendingDeleteId = id;
            confirmModal.style.display = "flex";
        }

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            confirmModal.style.display = "none";
            pendingDeleteId = null;
        });

        document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
            if (pendingDeleteId) {
                try {
                    confirmModal.style.display = "none";
                    await deleteDoc(doc(db, "products", pendingDeleteId));
                    showNotification("Product asset detached completely.");
                } catch (e) {
                    showNotification("Destruction command rejected.", true);
                } finally {
                    pendingDeleteId = null;
                }
            }
        });

        filterEl.addEventListener('change', applyFilterState);
        
        // Document Initialization
        loadInventory();
    </script>
</body>
</html>
