<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Command Center</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --dark: #0a0a0c;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--dark); color: white; margin: 0; padding: 20px; }

        /* Auth Gate */
        #auth-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        /* Navigation */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--glass); border: 1px solid #333; color: #888;
            padding: 10px 20px; cursor: pointer; border-radius: 5px;
        }
        .tab-btn.active { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(0, 243, 255, 0.1); }

        /* Layouts */
        .panel { display: none; background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .panel.active { display: block; }
        
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .grid-table th, .grid-table td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 5px;
        }
        .btn {
            padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .btn-primary { background: var(--neon-purple); color: white; }
        .btn-approve { background: #00ff88; color: black; }
        .btn-danger { background: #ff4d4d; color: white; }

        .deposit-card { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--neon-cyan); }
        .proof-img { max-width: 200px; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        
        .low-stock { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Access Gate -->
    <div id="auth-gate">
        <h2 style="color: var(--neon-cyan)">PR1MΞ SYSTEM OVERRIDE</h2>
        <input type="password" id="sys-pass" placeholder="Enter Admin Code" style="width: 250px; text-align: center;">
        <button class="btn btn-primary" style="margin-top: 15px;" onclick="checkPass()">ACCESS SYSTEM</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('add-prod')">ADD PRODUCT</button>
        <button class="tab-btn" onclick="showTab('users-list')">USERS</button>
        <button class="tab-btn" onclick="showTab('deps-list')">DEPOSITS</button>
        <button class="tab-btn" onclick="showTab('all-prods')">ALL PRODUCTS</button>
    </div>

    <!-- 1. ADD PRODUCT PANEL -->
    <div id="add-prod" class="panel active">
        <h2>Deploy New Asset</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="p-name">
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="p-cat">
                <option value="Logs">🚀 Social Logs</option>
                <option value="VPNs">🔐 VPNs</option>
                <option value="Numbers">📱 SMS Numbers</option>
                <option value="Bots">🤖 Utility Bots</option>
            </select>
        </div>
        <div class="form-group">
            <label>Price (₦)</label>
            <input type="number" id="p-price">
        </div>
        <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="p-img">
        </div>
        <div class="form-group">
            <label>Stock Mode</label>
            <select id="p-mode" onchange="toggleStockLabel()">
                <option value="SINGLE">Single Secret (Whole text is one item)</option>
                <option value="MULTIPLE">Multiple Items (Separate by commas)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="stock-label">Paste Stock Data</label>
            <textarea id="p-stock" rows="5"></textarea>
        </div>
        <button class="btn btn-primary" onclick="uploadProduct()">UPLOAD TO STOREFRONT</button>
    </div>

    <!-- 2. USERS PANEL -->
    <div id="users-list" class="panel">
        <h2>User Database</h2>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Balance</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-rows"></tbody>
        </table>
    </div>

    <!-- 3. DEPOSITS PANEL -->
    <div id="deps-list" class="panel">
        <h2>Pending Proofs</h2>
        <div id="deposit-container"></div>
    </div>

    <!-- 4. ALL PRODUCTS PANEL -->
    <div id="all-prods" class="panel">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2>Inventory Management</h2>
            <select id="view-filter" onchange="loadInventory()" style="width: 200px;">
                <option value="ALL">All Categories</option>
                <option value="LOW">⚠️ Low Stock (<3)</option>
                <option value="Logs">Logs Only</option>
                <option value="VPNs">VPNs Only</option>
            </select>
        </div>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventory-rows"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot, doc, updateDoc, deleteDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- AUTH ---
        window.checkPass = () => {
            if(document.getElementById('sys-pass').value === '1100') {
                document.getElementById('auth-gate').style.display = 'none';
                loadUsers();
                loadDeposits();
                loadInventory();
            } else {
                alert("INVALID CODE");
            }
        };

        // --- NAVIGATION ---
        window.showTab = (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        };

        window.toggleStockLabel = () => {
            const mode = document.getElementById('p-mode').value;
            document.getElementById('stock-label').innerText = mode === 'SINGLE' ? "Paste Secret Item (No commas needed)" : "Paste Multiple Items (Comma separated)";
        };

        // --- ADD PRODUCT ---
        window.uploadProduct = async () => {
            const name = document.getElementById('p-name').value;
            const cat = document.getElementById('p-cat').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const mode = document.getElementById('p-mode').value;
            const rawStock = document.getElementById('p-stock').value;

            if(!name || !price || !rawStock) return alert("Missing fields");

            const stockArray = mode === 'MULTIPLE' ? rawStock.split(',').map(s => s.trim()) : [rawStock];

            await addDoc(collection(db, "products"), {
                name, category: cat, price: parseFloat(price), image: img,
                mode, stock: stockArray, stockCount: stockArray.length,
                createdAt: serverTimestamp()
            });

            alert("Asset Deployed!");
            location.reload();
        };

        // --- USERS MANAGEMENT ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const tbody = document.getElementById('user-rows');
                tbody.innerHTML = "";
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.email}</td>
                            <td>₦${u.balance?.toLocaleString() || 0}</td>
                            <td><span style="color:${u.status === 'banned' ? 'red' : '#00ff88'}">${u.status || 'active'}</span></td>
                            <td>
                                <button class="btn btn-approve" onclick="editWallet('${uDoc.id}', '${u.email}')">Edit ₦</button>
                                <button class="btn btn-danger" onclick="toggleBan('${uDoc.id}', '${u.status}')">${u.status === 'banned' ? 'Unban' : 'Ban'}</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        window.editWallet = async (id, email) => {
            const amt = prompt(`Set new balance for ${email}:`);
            if(amt !== null) await updateDoc(doc(db, "users", id), { balance: parseFloat(amt) });
        };

        window.toggleBan = async (id, currentStatus) => {
            const newStatus = currentStatus === 'banned' ? 'active' : 'banned';
            await updateDoc(doc(db, "users", id), { status: newStatus });
        };

        // --- DEPOSITS MANAGEMENT ---
        function loadDeposits() {
            onSnapshot(query(collection(db, "deposits"), where("status", "==", "pending")), (snap) => {
                const container = document.getElementById('deposit-container');
                container.innerHTML = snap.empty ? "Clean - No pending proofs." : "";
                snap.forEach(dDoc => {
                    const d = dDoc.data();
                    container.innerHTML += `
                        <div class="deposit-card">
                            <p><strong>User:</strong> ${d.email} | <strong>Amount:</strong> ₦${d.amount}</p>
                            ${d.imagePath ? `<img src="${d.imageUrl}" class="proof-img" onclick="window.open('${d.imageUrl}')">` : '<p>No screenshot attached</p>'}
                            <div style="margin-top:10px;">
                                <button class="btn btn-approve" onclick="handleDeposit('${dDoc.id}', '${d.email}', ${d.amount}, 'approved', '${d.imagePath}')">APPROVE</button>
                                <button class="btn btn-danger" onclick="handleDeposit('${dDoc.id}', null, null, 'declined', '${d.imagePath}')">REJECT</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.handleDeposit = async (id, email, amount, status, imgPath) => {
            try {
                if(status === 'approved') {
                    const uSnap = await getDocs(query(collection(db, "users"), where("email", "==", email)));
                    if(!uSnap.empty) await updateDoc(doc(db, "users", uSnap.docs[0].id), { balance: increment(amount) });
                }
                
                // Delete proof image from storage if exists
                if(imgPath) {
                    const storageRef = ref(storage, imgPath);
                    await deleteObject(storageRef).catch(e => console.log("Storage delete error or file missing"));
                }

                // Delete the deposit request document entirely to keep DB clean
                await deleteDoc(doc(db, "deposits", id));
                alert(`Proof ${status} and removed from system.`);
            } catch (e) { alert("Error processing deposit"); }
        };

        // --- INVENTORY MANAGEMENT ---
        window.loadInventory = async () => {
            const filter = document.getElementById('view-filter').value;
            let q = collection(db, "products");
            
            const snap = await getDocs(q);
            const tbody = document.getElementById('inventory-rows');
            tbody.innerHTML = "";

            snap.forEach(pDoc => {
                const p = pDoc.data();
                
                // Filtering Logic
                if(filter === 'LOW' && p.stockCount >= 3) return;
                if(filter !== 'ALL' && filter !== 'LOW' && p.category !== filter) return;

                tbody.innerHTML += `
                    <tr>
                        <td>${p.name} <br><small>${p.category}</small></td>
                        <td>₦${p.price}</td>
                        <td class="${p.stockCount < 3 ? 'low-stock' : ''}">${p.stockCount}</td>
                        <td>
                            <button class="btn btn-approve" onclick="addStock('${pDoc.id}')">+ Stock</button>
                            <button class="btn btn-primary" onclick="editSecrets('${pDoc.id}')">Edit Secrets</button>
                            <button class="btn btn-danger" onclick="deleteAsset('${pDoc.id}')">Del</button>
                        </td>
                    </tr>
                `;
            });
        };

        window.addStock = async (id) => {
            const extra = prompt("Enter new items separated by commas:");
            if(!extra) return;
            const newItems = extra.split(',').map(s => s.trim());
            await updateDoc(doc(db, "products", id), {
                stock: increment(newItems), // Note: Need arrayUnion in production
                stockCount: increment(newItems.length)
            });
            loadInventory();
        };

        window.deleteAsset = async (id) => {
            if(confirm("Delete this product permanently?")) {
                await deleteDoc(doc(db, "products", id));
                loadInventory();
            }
        };

        window.editSecrets = async (id) => {
             alert("Full Stock Editing interface requires a separate Modal. For now, use '+ Stock' or delete and re-add.");
        };

    </script>
</body>
</html>
