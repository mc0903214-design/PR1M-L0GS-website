<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Command Center</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --dark: #0a0a0c;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--dark); color: white; margin: 0; padding: 20px; }

        /* Auth Gate */
        #auth-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        /* Navigation */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--glass); border: 1px solid #333; color: #888;
            padding: 10px 20px; cursor: pointer; border-radius: 5px;
            transition: 0.3s;
        }
        .tab-btn.active { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(0, 243, 255, 0.1); }

        /* Layouts */
        .panel { display: none; background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .panel.active { display: block; }
        
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .grid-table th, .grid-table td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 5px; outline: none;
        }
        input:focus { border-color: var(--neon-cyan); }

        .btn {
            padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--neon-purple); color: white; }
        .btn-approve { background: #00ff88; color: black; }
        .btn-danger { background: #ff4d4d; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 0.7rem; margin: 2px; }

        .deposit-card { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--neon-cyan); }
        .proof-img { max-width: 200px; border-radius: 5px; margin-top: 10px; cursor: pointer; border: 1px solid #333; }
        
        .low-stock { color: #ffcc00; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="auth-gate">
        <h2 style="color: var(--neon-cyan); letter-spacing: 5px;">PR1MΞ SYSTEM OVERRIDE</h2>
        <input type="password" id="sys-pass" placeholder="Enter Admin Code" style="width: 250px; text-align: center;">
        <button class="btn btn-primary" style="margin-top: 15px;" onclick="checkPass()">ACCESS SYSTEM</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('add-prod')">ADD PRODUCT</button>
        <button class="tab-btn" onclick="showTab('users-list')">USERS</button>
        <button class="tab-btn" onclick="showTab('deps-list')">DEPOSITS</button>
        <button class="tab-btn" onclick="showTab('all-prods')">INVENTORY</button>
    </div>

    <div id="add-prod" class="panel active">
        <h2>Deploy New Asset</h2>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="p-name" placeholder="e.g., Facebook Aged Logs">
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="p-cat">
                <option value="Logs">🚀 Logs</option>
                <option value="Working Pics">📂 Working Pics</option>
                <option value="VPNs and TV">🔐 VPNs & TV</option>
                <option value="iCloud"> iCloud</option>
                <option value="FMT and Updates">📝 FMT & Updates</option>
                <option value="CL Numbers">📱 CL Numbers</option>
                <option value="Bots">🤖 Bots</option>
            </select>
        </div>
        <div class="form-group">
            <label>Price (₦)</label>
            <input type="number" id="p-price">
        </div>
        <div class="form-group">
            <label>Icon/Image URL</label>
            <input type="text" id="p-img" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Stock Mode</label>
            <select id="p-mode" onchange="toggleStockLabel()">
                <option value="SINGLE">Single Secret (Whole text is one item)</option>
                <option value="MULTIPLE">Multiple Items (Separate by commas)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="stock-label">Paste Stock Data</label>
            <textarea id="p-stock" rows="5" placeholder="user:pass, user2:pass2..."></textarea>
        </div>
        <button class="btn btn-primary" id="uploadBtn" onclick="uploadProduct()">UPLOAD TO STOREFRONT</button>
    </div>

    <div id="users-list" class="panel">
        <h2>User Database</h2>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Balance</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-rows"></tbody>
        </table>
    </div>

    <div id="deps-list" class="panel">
        <h2>Pending Proofs</h2>
        <div id="deposit-container"></div>
    </div>

    <div id="all-prods" class="panel">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2>Inventory Management</h2>
            <select id="view-filter" style="width: 200px;" onchange="loadInventory()">
                <option value="ALL">All Categories</option>
                <option value="LOW">⚠️ Low Stock (<3)</option>
            </select>
        </div>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventory-rows"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot, doc, updateDoc, deleteDoc, increment, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ADMIN AUTH ---
        window.checkPass = () => {
            if(document.getElementById('sys-pass').value === '1100') {
                document.getElementById('auth-gate').style.display = 'none';
                initDashboard();
            } else {
                alert("INVALID ACCESS CODE");
            }
        };

        function initDashboard() {
            loadUsers();
            loadDeposits();
            loadInventory();
        }

        // --- NAVIGATION ---
        window.showTab = (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        };

        window.toggleStockLabel = () => {
            const mode = document.getElementById('p-mode').value;
            document.getElementById('stock-label').innerText = mode === 'SINGLE' ? "Paste Secret Item (Full text is one purchase)" : "Paste Multiple Items (Comma separated)";
        };

        // --- ADD PRODUCT ---
        window.uploadProduct = async () => {
            const btn = document.getElementById('uploadBtn');
            const name = document.getElementById('p-name').value;
            const cat = document.getElementById('p-cat').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const mode = document.getElementById('p-mode').value;
            const rawStock = document.getElementById('p-stock').value;

            if(!name || !price || !rawStock) return alert("All text fields are required");

            btn.disabled = true;
            btn.innerText = "Deploying...";

            const stockArray = mode === 'MULTIPLE' ? rawStock.split(',').map(s => s.trim()).filter(s => s !== "") : [rawStock];

            try {
                await addDoc(collection(db, "products"), {
                    name, 
                    category: cat, 
                    price: parseFloat(price), 
                    image: img || 'https://via.placeholder.com/150',
                    mode, 
                    stock: stockArray, 
                    stockCount: stockArray.length,
                    createdAt: serverTimestamp()
                });

                alert("Product Deployed!");
                location.reload();
            } catch (e) {
                alert("Deployment failed: " + e.message);
                btn.disabled = false;
                btn.innerText = "UPLOAD TO STOREFRONT";
            }
        };

        // --- USERS MANAGEMENT ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const tbody = document.getElementById('user-rows');
                tbody.innerHTML = "";
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    const userId = uDoc.id;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${u.email}</td>
                        <td>₦${(u.balance || 0).toLocaleString()}</td>
                        <td><span style="color:${u.status === 'banned' ? '#ff4d4d' : '#00ff88'}">${u.status || 'active'}</span></td>
                        <td>
                            <button class="btn btn-approve btn-sm" onclick="editWallet('${userId}', '${u.email}')">Edit ₦</button>
                            <button class="btn btn-danger btn-sm" onclick="toggleBan('${userId}', '${u.status}')">${u.status === 'banned' ? 'Unban' : 'Ban'}</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            });
        }

        window.editWallet = async (id, email) => {
            const amt = prompt(`Enter NEW TOTAL balance for ${email}:`);
            if(amt !== null && !isNaN(amt)) {
                await updateDoc(doc(db, "users", id), { balance: parseFloat(amt) });
            }
        };

        window.toggleBan = async (id, currentStatus) => {
            const newStatus = currentStatus === 'banned' ? 'active' : 'banned';
            await updateDoc(doc(db, "users", id), { status: newStatus });
        };

        // --- DEPOSITS MANAGEMENT ---
        function loadDeposits() {
            onSnapshot(query(collection(db, "deposits"), where("status", "==", "pending")), (snap) => {
                const container = document.getElementById('deposit-container');
                container.innerHTML = snap.empty ? "<p style='color:#555'>No pending deposits.</p>" : "";
                snap.forEach(dDoc => {
                    const d = dDoc.data();
                    const card = document.createElement('div');
                    card.className = 'deposit-card';
                    card.innerHTML = `
                        <p><strong>User:</strong> ${d.email} <br> <strong>Amount:</strong> ₦${d.amount.toLocaleString()}<br><strong>Method:</strong> ${d.method || 'Manual'}</p>
                        <div style="margin-top:10px;">
                            <button class="btn btn-approve" onclick="handleDeposit('${dDoc.id}', '${d.uid}', ${d.amount}, 'approved')">APPROVE</button>
                            <button class="btn btn-danger" onclick="handleDeposit('${dDoc.id}', null, null, 'declined')">REJECT</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        window.handleDeposit = async (docId, userUid, amount, status) => {
            if(!confirm(`Are you sure you want to ${status} this deposit?`)) return;

            try {
                if(status === 'approved' && userUid) {
                    await updateDoc(doc(db, "users", userUid), { 
                        balance: increment(amount) 
                    });
                }
                await updateDoc(doc(db, "deposits", docId), { status: status });
                alert(`Transaction ${status}.`);
            } catch (e) { 
                alert("Processing Error: " + e.message); 
            }
        };

        // --- INVENTORY MANAGEMENT ---
        window.loadInventory = function() {
            const filterEl = document.getElementById('view-filter');
            onSnapshot(collection(db, "products"), (snap) => {
                const tbody = document.getElementById('inventory-rows');
                const filter = filterEl.value;
                tbody.innerHTML = "";

                snap.forEach(pDoc => {
                    const p = pDoc.data();
                    if(filter === 'LOW' && p.stockCount >= 3) return;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${p.name}</strong><br><small style="color:#666">${p.category}</small></td>
                        <td>₦${p.price.toLocaleString()}</td>
                        <td class="${p.stockCount < 3 ? 'low-stock' : ''}">${p.stockCount}</td>
                        <td>
                            <button class="btn btn-approve btn-sm" onclick="addStock('${pDoc.id}')">+ Stock</button>
                            <button class="btn btn-primary btn-sm" onclick="editPrice('${pDoc.id}', ${p.price})">Price</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteAsset('${pDoc.id}')">Del</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            });
        }

        window.addStock = async (id) => {
            const extra = prompt("Paste new items (comma separated):");
            if(!extra) return;
            const newItems = extra.split(',').map(s => s.trim()).filter(s => s !== "");
            await updateDoc(doc(db, "products", id), {
                stock: arrayUnion(...newItems),
                stockCount: increment(newItems.length)
            });
            alert("Stock Added!");
        };

        window.editPrice = async (id, currentPrice) => {
            const newPrice = prompt("Enter new price:", currentPrice);
            if(newPrice !== null && !isNaN(newPrice)) {
                await updateDoc(doc(db, "products", id), { price: parseFloat(newPrice) });
            }
        };

        window.deleteAsset = async (id) => {
            if(confirm("Delete this product permanently?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

    </script>
</body>
</html>
