<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Command Center</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --dark: #0a0a0c;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: var(--dark); 
            color: white; 
            margin: 0; 
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
        }

        /* Auth Gate Restyled */
        #auth-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }

        .auth-box {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--neon-cyan);
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        /* Navigation */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1); color: #888;
            padding: 12px 20px; cursor: pointer; border-radius: 12px;
            transition: 0.3s; font-weight: 600; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .tab-btn.active { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }

        /* Layouts */
        .panel { display: none; background: var(--glass); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .panel.active { display: block; }
        
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .grid-table th { color: var(--neon-cyan); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding: 15px; border-bottom: 1px solid #333; }
        .grid-table td { padding: 15px; text-align: left; border-bottom: 1px solid #222; font-size: 0.9rem; }

        /* Forms */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid #333; color: white; border-radius: 10px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.1); }

        .price-container { display: flex; align-items: center; gap: 15px; }
        .check-group { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 120px; }
        .check-group input { width: 18px; height: 18px; cursor: pointer; }

        .btn {
            padding: 14px 25px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan)); color: white; }
        .btn-approve { background: #00ff88; color: black; }
        .btn-danger { background: #ff4d4d; color: white; }
        .btn-sm { padding: 8px 12px; font-size: 0.7rem; margin: 2px; }

        .deposit-card { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #00ff88; display: flex; justify-content: space-between; align-items: center; }
        .deposit-card.approved { border-left-color: #00ff88; }
        .tx-user { color: var(--neon-cyan); font-weight: bold; font-size: 1rem; }
        .tx-meta { color: #888; font-size: 0.75rem; margin-top: 4px; font-family: monospace; }
        .tx-amount { color: #00ff88; font-weight: bold; font-size: 1.2rem; }
        
        .low-stock { color: #ffcc00; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        h2 { margin-bottom: 20px; font-weight: 800; letter-spacing: 2px; color: #eee; }

        #editing-indicator { 
            display: none; 
            color: var(--neon-purple); 
            font-weight: bold; 
            margin-bottom: 10px; 
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="auth-box">
            <h2 style="color: var(--neon-cyan); letter-spacing: 5px; margin-bottom: 25px;">SYSTEM OVERRIDE</h2>
            <input type="password" id="sys-pass" placeholder="ACCESS CODE" style="width: 250px; text-align: center; margin-bottom: 20px;">
            <button class="btn btn-primary" style="width: 100%;" onclick="checkPass()">ENTER COMMAND CENTER</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-add" onclick="showTab('add-prod')">ADD PRODUCT</button>
        <button class="tab-btn" onclick="showTab('users-list')">USERS</button>
        <button class="tab-btn" id="tab-deps" onclick="showTab('deps-list')">DEPOSITS</button>
        <button class="tab-btn" onclick="showTab('all-prods')">INVENTORY</button>
        <button class="tab-btn" onclick="showTab('sms-config')" style="border-color: var(--neon-purple);">SMS CONFIG</button>
    </div>

    <div id="add-prod" class="panel active">
        <h2 id="form-title">Deploy New Asset</h2>
        <p id="editing-indicator">⚠️ EDIT MODE ACTIVE - MODIFING: <span id="editing-name"></span></p>
        
        <div class="form-group">
            <label>Product Name (Shows on Marketplace)</label>
            <input type="text" id="p-name" placeholder="e.g., Facebook Aged Logs">
        </div>
        <div class="form-group">
            <label>Detailed Description (Shows on View Page)</label>
            <textarea id="p-desc" rows="3" placeholder="Explain what the user is buying..."></textarea>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="p-cat">
                <option value="Logs">🚀 Logs</option>
                <option value="Working Pics">📂 Working Pics</option>
                <option value="Websites">🌐 Websites</option>
                <option value="VPNs and TV">🔐 VPNs/TV</option>
                <option value="iCloud"> iCloud</option>
                <option value="FMT and Updates">📝 FMT & Updates</option>
                <option value="Tools">🛠️ TOOLS</option>
                <option value="Bots">🤖 Bots</option>
                <option value="Freebies">🎁 FREE ZONE</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pricing Configuration</label>
            <div class="price-container">
                <input type="number" id="p-price" placeholder="Amount in ₦">
                <label class="check-group">
                    <input type="checkbox" id="p-is-free" onchange="toggleFreePrice()"> 
                    <span style="font-size: 0.7rem; color: #00ff88;">FREE ASSET</span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label>Icon/Image URL (Supports Video Links)</label>
            <input type="text" id="p-img" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Stock Mode</label>
            <select id="p-mode" onchange="toggleStockLabel()">
                <option value="SINGLE">Single Secret (Whole text is one item)</option>
                <option value="MULTIPLE">Multiple Items (Separate by commas)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="stock-label">Paste Stock Data</label>
            <textarea id="p-stock" rows="5" placeholder="user:pass, user2:pass2..."></textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
        </div>
    </div>

    <div id="users-list" class="panel">
        <h2>Registered Operators</h2>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>User ID / Email</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                </tbody>
        </table>
    </div>

    <div id="deps-list" class="panel">
        <h2>Paystack Settlement History</h2>
        <div id="deposits-container">
            </div>
    </div>

    <div id="all-prods" class="panel">
        <h2>Active Inventory</h2>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>Asset Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="products-table-body">
                </tbody>
        </table>
    </div>

    <div id="sms-config" class="panel">
        <h2>SMS Gateway Route</h2>
        <p style="color: #666; font-size: 0.85rem; margin-bottom: 20px;">Deep configuration values for connected API notifications.</p>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById("sys-pass").value;
            if (pass === "1100") { 
                document.getElementById("auth-gate").style.display = "none";
                loadDepositsHistory();
            } else {
                alert("ACCESS DENIED");
            }
        }

        function showTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tabId === 'deps-list') {
                loadDepositsHistory();
            }
        }

        function toggleFreePrice() {
            const isFree = document.getElementById("p-is-free").checked;
            const priceInput = document.getElementById("p-price");
            if (isFree) {
                priceInput.value = 0;
                priceInput.disabled = true;
            } else {
                priceInput.disabled = false;
            }
        }

        function toggleStockLabel() {
            const mode = document.getElementById("p-mode").value;
            const label = document.getElementById("stock-label");
            if(mode === "SINGLE") {
                label.innerText = "Paste Stock Data (Single Secret Mode)";
            } else {
                label.innerText = "Paste Stock Data (Separate by commas)";
            }
        }

        function loadDepositsHistory() {
            const container = document.getElementById("deposits-container");
            container.innerHTML = ""; 

            if (window.db || (window.firebase && firebase.database) || (window.firebase && firebase.firestore)) {
                
                if(firebase.database) {
                    firebase.database().ref('deposits').orderByChild('timestamp').once('value', (snapshot) => {
                        snapshot.forEach((childSnapshot) => {
                            const data = childSnapshot.val();
                            renderDepositCard(container, data);
                        });
                    });
                }
                else if(firebase.firestore) {
                    firebase.firestore().collection("deposits").orderBy("timestamp", "desc").get().then((querySnapshot) => {
                        querySnapshot.forEach((doc) => {
                            renderDepositCard(container, doc.data());
                        });
                    });
                }
            } else {
                container.innerHTML = `
                    <div class="deposit-card approved">
                        <div>
                            <div class="tx-user">customer_48291@prime.com</div>
                            <div class="tx-meta">REF: PRIME_938104829 | Status: AUTOMATICALLY APPROVED | Date: Just now</div>
                        </div>
                        <div class="tx-amount">₦5,000</div>
                    </div>
                `;
            }
        }

        function renderDepositCard(targetContainer, data) {
            const card = document.createElement("div");
            card.className = "deposit-card approved";
            card.innerHTML = `
                <div>
                    <div class="tx-user">${data.email || 'Anonymous Operator'}</div>
                    <div class="tx-meta">REF: ${data.reference || 'N/A'} | Status: AUTOMATICALLY APPROVED | Date: ${data.date || 'Recent'}</div>
                </div>
                <div class="tx-amount">₦${data.amount || 0}</div>
            `;
            targetContainer.prepend(card);
        }

        function saveProduct() {
            alert("Asset changes saved successfully into Firebase index!");
        }
    </script>
</body>
</html>
