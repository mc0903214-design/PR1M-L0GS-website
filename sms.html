<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ L0GS — Service Maintenance</title>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #060608;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f1f3;
            --text-secondary: #a0aec0;
            --whatsapp: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;

            background-image:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(188, 19, 254, 0.10) 0%,
                    transparent 40%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(0, 243, 255, 0.08) 0%,
                    transparent 40%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    #0d0d16 0%,
                    #060608 100%
                );
        }

        /* Ambient Glow */
        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            top: -120px;
            left: -100px;
            background: radial-gradient(
                circle,
                rgba(188, 19, 254, 0.12),
                transparent 70%
            );
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            bottom: -130px;
            right: -100px;
            background: radial-gradient(
                circle,
                rgba(0, 243, 255, 0.10),
                transparent 70%
            );
            pointer-events: none;
        }

        /* Main Card */
        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            padding: 42px 28px 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(255, 255, 255, 0.018)
                );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);

            text-align: center;
            overflow: hidden;
        }

        /* Top Cyan/Purple Glow */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--neon-cyan),
                var(--neon-purple),
                transparent
            );
            box-shadow:
                0 0 15px rgba(0, 243, 255, 0.45),
                0 0 25px rgba(188, 19, 254, 0.25);
        }

        /* Decorative Glow */
        .container::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            top: -80px;
            right: -70px;
            background: radial-gradient(
                circle,
                rgba(0, 243, 255, 0.13),
                transparent 70%
            );
            border-radius: 50%;
            pointer-events: none;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;

            color: #718096;
            text-decoration: none;

            font-size: 0.82rem;
            font-weight: 600;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back-btn:hover {
            color: var(--neon-cyan);
            transform: translateX(-2px);
        }

        /* Maintenance Icon */
        .icon-container {
            width: 82px;
            height: 82px;
            margin: 20px auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 243, 255, 0.10),
                    rgba(188, 19, 254, 0.10)
                );

            border: 1px solid rgba(0, 243, 255, 0.22);

            color: var(--neon-cyan);

            box-shadow:
                0 0 25px rgba(0, 243, 255, 0.10),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }

        .icon-container svg {
            width: 42px;
            height: 42px;

            filter:
                drop-shadow(0 0 7px rgba(0, 243, 255, 0.45));
        }

        /* Heading */
        h1 {
            color: #ffffff;
            font-size: 1.55rem;
            font-weight: 750;
            letter-spacing: -0.3px;
            margin-bottom: 12px;

            text-shadow:
                0 0 14px rgba(0, 243, 255, 0.12);
        }

        /* Description */
        p {
            color: #a0aec0;
            font-size: 0.91rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        /* Small Highlight */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 18px;

            padding: 5px 10px;

            border-radius: 20px;

            background: rgba(255, 180, 0, 0.08);
            border: 1px solid rgba(255, 180, 0, 0.18);

            color: #ffc857;

            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffc857;
            box-shadow: 0 0 8px rgba(255, 200, 87, 0.8);
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            width: 100%;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 13px 20px;

            background:
                linear-gradient(
                    90deg,
                    #25d366 0%,
                    #128c7e 100%
                );

            color: #ffffff;
            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;

            font-size: 0.85rem;
            font-weight: 700;

            box-shadow:
                0 5px 18px rgba(37, 211, 102, 0.22),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(37, 211, 102, 0.30),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);

            filter: brightness(1.05);
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }

        .whatsapp-btn svg {
            width: 21px;
            height: 21px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Footer Brand */
        .brand-footer {
            margin-top: 24px;
            color: #4a5568;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-footer span {
            color: rgba(0, 243, 255, 0.55);
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 18px 14px;
            }

            .container {
                padding: 40px 22px 26px;
                border-radius: 22px;
            }

            .icon-container {
                width: 76px;
                height: 76px;
                border-radius: 22px;
            }

            .icon-container svg {
                width: 39px;
                height: 39px;
            }

            h1 {
                font-size: 1.4rem;
            }

            p {
                font-size: 0.88rem;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

</body>
</html>
