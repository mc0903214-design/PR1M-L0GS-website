<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ SMS - Under Construction</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --dark-bg: #060608;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f1f3;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(188, 19, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0d0d16 0%, #060608 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }

        /* --- CONTAINER WORKSPACE --- */
        .maintenance-card {
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.2) 0%, rgba(14, 14, 18, 0.6) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* --- ANIMATED PULSE GLOW --- */
        .icon-wrapper {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 24px auto;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); transform: scale(1); }
            100% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.5); transform: scale(1.03); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        p {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        /* --- BACK BUTTON --- */
        .back-btn {
            background: linear-gradient(90deg, var(--neon-purple) 0%, #9d4edd 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(188, 19, 254, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .back-btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(188, 19, 254, 0.45);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon-wrapper">
            <!-- Gear/Production SVG Icon -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </div>
        
        <h1>PR1MΞ SMS</h1>
        <p>This section is currently in production and it will be live soon. Stay tuned for temporary VoIP activation modules.</p>
        
        <a href="shop.html" class="back-btn">
            ← Return to Market
        </a>
    </div>

</body>
</html>
