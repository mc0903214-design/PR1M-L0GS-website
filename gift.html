<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PR1MΞ Gift Store</title>

<style>

:root {
    --neon-cyan: #00f3ff;
    --neon-purple: #bc13fe;
    --dark-bg: #060608;
    --glass-bg: rgba(255,255,255,.035);
    --glass-border: rgba(255,255,255,.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(188,19,254,.08) 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,243,255,.06) 0%,
            transparent 35%
        ),
        #060608;

    color: #f1f1f3;
    min-height: 100vh;

    padding: 20px 14px 50px;

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeSpeed;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

.hidden {
    display: none !important;
}


/* =========================================================
   LOADER
========================================================= */

.spinner {
    width: 25px;
    height: 25px;

    border: 2.5px solid rgba(255,255,255,.14);
    border-top-color: var(--neon-cyan);

    border-radius: 50%;

    animation: spin .8s linear infinite;

    display: inline-block;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   HEADER
========================================================= */

header {

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 4px 5px 20px;
}

.logo {

    font-size: 1.35rem;
    font-weight: 800;

    letter-spacing: 2.5px;

    color: #fff;

    text-shadow:
        0 0 10px rgba(0,243,255,.4);
}

.back-btn {

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: rgba(255,255,255,.045);

    border: 1px solid var(--glass-border);

    color: #fff;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.back-btn:hover {

    background: rgba(255,255,255,.08);

}

.back-btn:active {

    transform: scale(.95);

}


/* =========================================================
   HERO
========================================================= */

.hero {

    position: relative;

    padding: 28px 22px;

    margin-bottom: 22px;

    border-radius: 24px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(188,19,254,.18),
            rgba(0,243,255,.08)
        );

    border: 1px solid rgba(188,19,254,.18);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.hero::after {

    content: '';

    position: absolute;

    width: 170px;
    height: 170px;

    right: -70px;
    top: -70px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,243,255,.16),
            transparent 70%
        );

    pointer-events: none;
}

.hero-content {

    position: relative;

    z-index: 1;
}

.hero-title {

    font-size: 1.75rem;

    font-weight: 800;

    margin-bottom: 8px;

    color: #fff;
}

.hero-title span {

    color: var(--neon-cyan);

    text-shadow:
        0 0 10px rgba(0,243,255,.3);
}

.hero-description {

    color: #aeb8c7;

    font-size: .9rem;

    line-height: 1.6;

    max-width: 500px;
}

.gift-count {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-top: 18px;

    padding: 8px 12px;

    border-radius: 12px;

    background: rgba(255,255,255,.045);

    border: 1px solid rgba(255,255,255,.07);

    color: #cbd5e0;

    font-size: .75rem;

    font-weight: 600;
}

.gift-count-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--neon-cyan);

    box-shadow:
        0 0 8px rgba(0,243,255,.7);
}


/* =========================================================
   BALANCE
========================================================= */

.balance-card {

    background:
        linear-gradient(
            135deg,
            rgba(30,60,114,.40),
            rgba(42,82,152,.18)
        );

    border:
        1px solid rgba(58,118,240,.25);

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 24px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.balance-left {

    min-width: 0;
}

.balance-label {

    color: #8e9aaa;

    font-size: .7rem;

    text-transform: uppercase;

    letter-spacing: 1.3px;

    font-weight: 600;

    margin-bottom: 5px;
}

.balance-value {

    font-size: 1.45rem;

    font-weight: 750;

    color: #fff;

    min-height: 30px;

    display: flex;

    align-items: center;
}

.topup-btn {

    flex-shrink: 0;

    text-decoration: none;

    color: #060608;

    background: #fff;

    padding: 10px 14px;

    border-radius: 12px;

    font-size: .75rem;

    font-weight: 750;

    border: none;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.topup-btn:active {

    transform: scale(.96);

}

.topup-btn:hover {

    opacity: .9;

}


/* =========================================================
   SECTION
========================================================= */

.section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;

    padding: 0 3px;
}

.section-title {

    font-size: .78rem;

    color: #718096;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 2px;
}


/* =========================================================
   GIFT GRID
========================================================= */

.gift-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 13px;

    margin-bottom: 40px;
}


/* =========================================================
   GIFT CARD
========================================================= */

.gift-card {

    background: rgba(255,255,255,.028);

    border:
        1px solid var(--glass-border);

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    min-width: 0;

    contain: content;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}

.gift-card:hover {

    background: rgba(255,255,255,.045);

    border-color:
        rgba(255,255,255,.13);

}

.gift-card:active {

    transform: scale(.985);

}


/* =========================================================
   IMAGE
========================================================= */

.gift-image-container {

    width: 100%;

    aspect-ratio: 1 / 1;

    background:
        rgba(255,255,255,.025);

    overflow: hidden;

    position: relative;
}

.gift-image-container img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        opacity .2s ease;
}

.gift-image-fallback {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(188,19,254,.12),
            rgba(0,243,255,.08)
        );

    color: #718096;
}

.gift-image-fallback svg {

    width: 35px;
    height: 35px;

    opacity: .55;
}


/* =========================================================
   CARD CONTENT
========================================================= */

.gift-content {

    padding: 13px;

    display: flex;

    flex-direction: column;

    flex: 1;
}

.gift-name {

    color: #fff;

    font-size: .88rem;

    font-weight: 700;

    line-height: 1.3;

    margin-bottom: 5px;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.gift-description {

    color: #8792a3;

    font-size: .72rem;

    line-height: 1.45;

    margin-bottom: 12px;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;

    flex: 1;
}

.gift-bottom {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;

    margin-top: auto;
}

.gift-price {

    color: var(--neon-cyan);

    font-size: .88rem;

    font-weight: 800;

    white-space: nowrap;
}

.send-gift-btn {

    border: none;

    border-radius: 10px;

    padding: 8px 10px;

    background:
        linear-gradient(
            90deg,
            var(--neon-purple),
            #9d4edd
        );

    color: #fff;

    font-size: .66rem;

    font-weight: 800;

    cursor: pointer;

    white-space: nowrap;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.send-gift-btn:hover {

    opacity: .92;

}

.send-gift-btn:active {

    transform: scale(.95);

}


/* =========================================================
   LOADING
========================================================= */

.loading-state {

    grid-column: 1 / -1;

    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 170px;

    border:
        1px dashed rgba(255,255,255,.08);

    border-radius: 18px;
}

.loading-inner {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.loading-text {

    color: #718096;

    font-size: .78rem;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state {

    grid-column: 1 / -1;

    padding: 45px 20px;

    text-align: center;

    border:
        1px dashed var(--glass-border);

    border-radius: 18px;

    color: #718096;
}

.empty-icon {

    width: 55px;
    height: 55px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 auto 14px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.07);
}

.empty-icon svg {

    width: 26px;
    height: 26px;

    opacity: .6;
}

.empty-title {

    color: #cbd5e0;

    font-size: .9rem;

    font-weight: 700;

    margin-bottom: 5px;
}

.empty-message {

    font-size: .75rem;

    color: #667386;
}


/* =========================================================
   ERROR
========================================================= */

.error-state {

    grid-column: 1 / -1;

    padding: 35px 20px;

    text-align: center;

    border:
        1px dashed rgba(255,75,75,.18);

    border-radius: 18px;

    color: #9b6b6b;
}

.retry-btn {

    margin-top: 13px;

    padding: 9px 15px;

    border-radius: 10px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    color: #fff;

    font-size: .75rem;

    font-weight: 700;

    cursor: pointer;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translate(-50%, 100px);

    width: calc(100% - 30px);

    max-width: 380px;

    padding: 13px 16px;

    border-radius: 14px;

    background:
        rgba(10,10,14,.97);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 8px 30px rgba(0,0,0,.4);

    color: #fff;

    font-size: .78rem;

    text-align: center;

    z-index: 9999;

    opacity: 0;

    transition:
        transform .22s ease,
        opacity .22s ease;
}

.toast.show {

    transform:
        translate(-50%, 0);

    opacity: 1;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 520px) {

    body {
        padding:
            16px 11px 40px;
    }

    .hero {
        padding: 24px 19px;
    }

    .hero-title {
        font-size: 1.5rem;
    }

    .balance-card {
        padding: 17px;
    }

    .gift-grid {
        gap: 10px;
    }

    .gift-content {
        padding: 11px;
    }

    .gift-name {
        font-size: .82rem;
    }

    .gift-description {
        font-size: .68rem;
    }

    .gift-price {
        font-size: .8rem;
    }

    .send-gift-btn {
        padding:
            8px 9px;

        font-size: .61rem;
    }

}

@media (max-width: 360px) {

    .gift-grid {
        grid-template-columns: 1fr;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;

        scroll-behavior: auto !important;
    }

}

</style>
</head>

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",

    authDomain:
        "primelogs-web.firebaseapp.com",

    projectId:
        "primelogs-web",

    storageBucket:
        "primelogs-web.firebasestorage.app",

    messagingSenderId:
        "732956069251",

    appId:
        "1:732956069251:web:b9c8be37e6db4f98db3ab6"

};



/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =========================================================
   DOM CACHE
========================================================= */

const giftGrid =
    document.getElementById(
        'giftGrid'
    );

const giftCount =
    document.getElementById(
        'giftCount'
    );

const balanceLoader =
    document.getElementById(
        'balanceLoader'
    );

const balanceText =
    document.getElementById(
        'balanceText'
    );

const balanceDisplay =
    document.getElementById(
        'balance'
    );

const backButton =
    document.getElementById(
        'backButton'
    );

const toast =
    document.getElementById(
        'toast'
    );



/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let allGifts = [];

let balanceUnsubscribe = null;



/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(
    'click',
    () => {

        if (
            window.history.length > 1
        ) {

            window.history.back();

        } else {

            window.location.href =
                'index.html';

        }

    }
);



/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message) {

    clearTimeout(toastTimer);

    toast.textContent =
        message;

    toast.classList.add(
        'show'
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    'show'
                );

            },
            3000
        );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return '';

    }


    const div =
        document.createElement(
            'div'
        );

    div.textContent =
        String(value);

    return div.innerHTML;

}



/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(value) {

    const number =
        Number(value || 0);

    return number.toLocaleString(
        undefined,
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}



/* =========================================================
   CREATE GIFT CARD
========================================================= */

function createGiftCard(
    gift,
    index
) {

    const card =
        document.createElement(
            'div'
        );

    card.className =
        'gift-card';


    const imageContainer =
        document.createElement(
            'div'
        );

    imageContainer.className =
        'gift-image-container';


    /*
     * Support both imageUrls array
     * and a possible single imageUrl.
     */

    let imageUrls = [];


    if (
        Array.isArray(
            gift.imageUrls
        )
    ) {

        imageUrls =
            gift.imageUrls.filter(
                url =>
                    typeof url === 'string' &&
                    url.trim()
            );

    }


    if (
        !imageUrls.length &&
        typeof gift.imageUrl === 'string' &&
        gift.imageUrl.trim()
    ) {

        imageUrls = [
            gift.imageUrl.trim()
        ];

    }


    if (
        !imageUrls.length
    ) {

        const fallback =
            document.createElement(
                'div'
            );

        fallback.className =
            'gift-image-fallback';

        fallback.innerHTML = `
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
            >
                <rect
                    x="3"
                    y="8"
                    width="18"
                    height="13"
                    rx="2"
                />
                <path d="M12 8v13"/>
                <path d="M3 12h18"/>
                <path d="M12 8H8.5a2.5 2.5 0 1 1 0-5C10.5 3 12 8 12 8Z"/>
                <path d="M12 8h3.5a2.5 2.5 0 1 0 0-5C13.5 3 12 8 12 8Z"/>
            </svg>
        `;

        imageContainer.appendChild(
            fallback
        );

    } else {

        const image =
            document.createElement(
                'img'
            );

        image.alt =
            gift.name ||
            'Gift';

        image.loading =
            index < 4
                ? 'eager'
                : 'lazy';

        image.decoding =
            'async';

        image.src =
            imageUrls[0];


        image.addEventListener(
            'error',
            () => {

                image.style.display =
                    'none';

                const fallback =
                    document.createElement(
                        'div'
                    );

                fallback.className =
                    'gift-image-fallback';

                fallback.innerHTML = `
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                    >
                        <rect
                            x="3"
                            y="8"
                            width="18"
                            height="13"
                            rx="2"
                        />
                        <path d="M12 8v13"/>
                        <path d="M3 12h18"/>
                        <path d="M12 8H8.5a2.5 2.5 0 1 1 0-5C10.5 3 12 8 12 8Z"/>
                        <path d="M12 8h3.5a2.5 2.5 0 1 0 0-5C13.5 3 12 8 12 8Z"/>
                    </svg>
                `;

                imageContainer.appendChild(
                    fallback
                );

            },
            {
                once: true
            }
        );


        imageContainer.appendChild(
            image
        );


        /*
         * If a gift has multiple images,
         * automatically rotate them.
         *
         * This does NOT affect loading
         * of the Firestore data.
         */

        if (
            imageUrls.length > 1
        ) {

            let imageIndex = 0;

            const interval =
                setInterval(
                    () => {

                        if (
                            !document.body.contains(
                                card
                            )
                        ) {

                            clearInterval(
                                interval
                            );

                            return;

                        }


                        imageIndex =
                            (
                                imageIndex + 1
                            ) %
                            imageUrls.length;


                        image.style.opacity =
                            '.25';


                        setTimeout(
                            () => {

                                image.src =
                                    imageUrls[
                                        imageIndex
                                    ];

                                image.style.opacity =
                                    '1';

                            },
                            120
                        );

                    },
                    4000
                );

        }

    }



    /* =====================================================
       CARD CONTENT
    ===================================================== */

    const content =
        document.createElement(
            'div'
        );

    content.className =
        'gift-content';


    const name =
        document.createElement(
            'div'
        );

    name.className =
        'gift-name';

    name.textContent =
        gift.name ||
        'Unnamed Gift';


    const description =
        document.createElement(
            'div'
        );

    description.className =
        'gift-description';

    description.textContent =
        gift.description ||
        'A special gift for someone special.';


    const bottom =
        document.createElement(
            'div'
        );

    bottom.className =
        'gift-bottom';


    const price =
        document.createElement(
            'div'
        );

    price.className =
        'gift-price';

    price.textContent =
        `₦${formatPrice(
            gift.price
        )}`;


    const sendButton =
        document.createElement(
            'button'
        );

    sendButton.type =
        'button';

    sendButton.className =
        'send-gift-btn';

    sendButton.textContent =
        'SEND THIS GIFT';


    sendButton.addEventListener(
        'click',
        event => {

            event.stopPropagation();


            /*
             * Logged-out users must login
             * before purchasing.
             */

            if (!currentUser) {

                window.location.href =
                    'login.html';

                return;

            }


            /*
             * Logged-in users go directly
             * to the gift checkout page.
             */

            window.location.href =
                `buygift.html?id=${encodeURIComponent(
                    gift.id
                )}`;

        }
    );


    bottom.appendChild(
        price
    );

    bottom.appendChild(
        sendButton
    );


    content.appendChild(
        name
    );

    content.appendChild(
        description
    );

    content.appendChild(
        bottom
    );


    card.appendChild(
        imageContainer
    );

    card.appendChild(
        content
    );


    return card;

}



/* =========================================================
   RENDER GIFTS
========================================================= */

function renderGifts(
    gifts
) {

    /*
     * Clear the loading spinner only
     * after Firestore has finished.
     */

    giftGrid.replaceChildren();


    if (
        !gifts.length
    ) {

        const empty =
            document.createElement(
                'div'
            );

        empty.className =
            'empty-state';

        empty.innerHTML = `

            <div class="empty-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                >
                    <rect
                        x="3"
                        y="8"
                        width="18"
                        height="13"
                        rx="2"
                    />

                    <path d="M12 8v13"/>

                    <path d="M3 12h18"/>

                    <path d="M12 8H8.5a2.5 2.5 0 1 1 0-5C10.5 3 12 8 12 8Z"/>

                    <path d="M12 8h3.5a2.5 2.5 0 1 0 0-5C13.5 3 12 8 12 8Z"/>
                </svg>

            </div>

            <div class="empty-title">
                No Gifts Available
            </div>

            <div class="empty-message">
                New gifts will appear here when they are available.
            </div>

        `;

        giftGrid.appendChild(
            empty
        );

        giftCount.textContent =
            '0 gifts available';

        return;

    }


    /*
     * Sort newest gifts first.
     */

    gifts.sort(
        (a, b) => {

            const aTime =
                getTimestampMs(
                    a.createdAt
                );

            const bTime =
                getTimestampMs(
                    b.createdAt
                );

            return bTime - aTime;

        }
    );


    giftCount.textContent =
        `${gifts.length} ${
            gifts.length === 1
                ? 'gift'
                : 'gifts'
        } available`;


    /*
     * Same basic loading/rendering
     * philosophy as your marketplace.
     *
     * Render in small batches so
     * a large gift collection does
     * not block the page.
     */

    const BATCH_SIZE = 10;

    let currentIndex = 0;


    function renderBatch() {

        const fragment =
            document.createDocumentFragment();


        const end =
            Math.min(
                currentIndex +
                    BATCH_SIZE,
                gifts.length
            );


        for (
            let i = currentIndex;
            i < end;
            i++
        ) {

            fragment.appendChild(
                createGiftCard(
                    gifts[i],
                    i
                )
            );

        }


        giftGrid.appendChild(
            fragment
        );


        currentIndex =
            end;


        if (
            currentIndex <
            gifts.length
        ) {

            requestAnimationFrame(
                renderBatch
            );

        }

    }


    renderBatch();

}



/* =========================================================
   TIMESTAMP HELPER
========================================================= */

function getTimestampMs(
    value
) {

    if (!value) {
        return 0;
    }


    if (
        typeof value.toMillis ===
        'function'
    ) {

        return value.toMillis();

    }


    if (
        typeof value.toDate ===
        'function'
    ) {

        return value.toDate().getTime();

    }


    if (
        typeof value === 'number'
    ) {

        return value;

    }


    const date =
        new Date(value);


    return isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}



/* =========================================================
   LOAD GIFTS
========================================================= */

async function loadGifts() {

    /*
     * IMPORTANT:
     *
     * We do NOT use onSnapshot()
     * here.
     *
     * This follows the same basic
     * loading method as your
     * marketplace page:
     *
     * getDocs()
     *
     * Wait for Firebase.
     *
     * Then render.
     */


    giftGrid.innerHTML = `

        <div class="loading-state">

            <div class="loading-inner">

                <div class="spinner"></div>

                <div class="loading-text">
                    Loading gifts...
                </div>

            </div>

        </div>

    `;


    giftCount.textContent =
        'Loading gifts...';


    try {

        const giftsQuery =
            query(
                collection(
                    db,
                    'gifts'
                ),

                where(
                    'active',
                    '==',
                    true
                )
            );


        /*
         * Wait for Firestore to actually
         * return the collection.
         */

        const snapshot =
            await getDocs(
                giftsQuery
            );


        const gifts = [];


        snapshot.forEach(
            giftDoc => {

                const data =
                    giftDoc.data();


                gifts.push({

                    id:
                        giftDoc.id,

                    ...data

                });

            }
        );


        /*
         * Store the complete result.
         */

        allGifts =
            gifts;


        /*
         * ONLY NOW do we remove
         * the loading spinner.
         */

        renderGifts(
            allGifts
        );


    } catch (error) {

        console.error(
            'Gift loading error:',
            error
        );


        /*
         * Important:
         *
         * An actual Firestore error
         * should NOT be displayed as
         * "No Gifts Available".
         */

        giftGrid.innerHTML = `

            <div class="error-state">

                <div style="
                    color:#ff7a7a;
                    font-size:.9rem;
                    font-weight:700;
                    margin-bottom:6px;
                ">
                    Unable to load gifts
                </div>

                <div style="
                    font-size:.75rem;
                    line-height:1.5;
                ">
                    Please check your connection
                    and try again.
                </div>

                <button
                    class="retry-btn"
                    id="retryGiftButton"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        `;


        giftCount.textContent =
            'Unavailable';


        const retryButton =
            document.getElementById(
                'retryGiftButton'
            );


        if (retryButton) {

            retryButton.addEventListener(
                'click',
                loadGifts
            );

        }

    }

}



/* =========================================================
   BALANCE
========================================================= */

function startBalanceListener(
    user
) {

    if (
        balanceUnsubscribe
    ) {

        balanceUnsubscribe();

        balanceUnsubscribe =
            null;

    }


    balanceUnsubscribe =
        onSnapshot(
            doc(
                db,
                'users',
                user.uid
            ),

            snapshot => {

                /*
                 * We still keep the balance
                 * realtime because that is
                 * separate from gift loading.
                 */

                if (
                    !snapshot.exists()
                ) {

                    balanceLoader.classList.add(
                        'hidden'
                    );

                    balanceText.classList.remove(
                        'hidden'
                    );

                    balanceDisplay.textContent =
                        '0.00';

                    return;

                }


                const data =
                    snapshot.data();


                const userBalance =
                    Number(
                        data.balance || 0
                    );


                balanceDisplay.textContent =
                    userBalance.toLocaleString(
                        undefined,
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    );


                balanceLoader.classList.add(
                    'hidden'
                );


                balanceText.classList.remove(
                    'hidden'
                );

            },

            error => {

                console.error(
                    'Balance listener error:',
                    error
                );


                balanceLoader.classList.add(
                    'hidden'
                );


                balanceText.classList.remove(
                    'hidden'
                );


                balanceDisplay.textContent =
                    '0.00';

            }
        );

}



/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        currentUser =
            user || null;


        /*
         * Gift loading is NOT dependent
         * on authentication.
         *
         * Everyone can browse gifts.
         */

        if (user) {

            startBalanceListener(
                user
            );

        } else {

            /*
             * Logged-out users simply
             * see ₦0.00.
             */

            if (
                balanceUnsubscribe
            ) {

                balanceUnsubscribe();

                balanceUnsubscribe =
                    null;

            }


            balanceLoader.classList.add(
                'hidden'
            );

            balanceText.classList.remove(
                'hidden'
            );

            balanceDisplay.textContent =
                '0.00';

        }

    }
);



/* =========================================================
   START GIFT LOADING IMMEDIATELY
========================================================= */

/*
 * IMPORTANT:
 *
 * This is intentionally outside
 * onAuthStateChanged().
 *
 * Therefore the gift collection
 * starts loading immediately,
 * whether the visitor is logged
 * in or logged out.
 */

loadGifts();



/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    'beforeunload',
    () => {

        if (
            balanceUnsubscribe
        ) {

            balanceUnsubscribe();

        }

    }
);

</script>
