<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet | PR1MΞ</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --dark-bg: #0a0a0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--neon-cyan);
            font-size: 1.5rem;
            margin-right: 15px;
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .step-container {
            background: var(--glass-bg);
            padding: 35px 25px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #ccc;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 12px;
            outline: none;
            font-size: 1.4rem;
            text-align: center;
            font-weight: bold;
        }

        input:focus {
            border-color: var(--neon-cyan);
        }

        /* Auto-fill Price Box Container */
        .preset-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .preset-btn:active {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            padding: 18px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="shop.html" class="back-btn">←</a>
            <h2 id="page-title">Fund Wallet</h2>
        </div>

        <div id="paymentFormContainer">
            <div class="step-container">
                <form id="paymentForm">
                    <label for="depositAmount">How much do you want to deposit? (₦)</label>
                    <input type="number" id="depositAmount" placeholder="Min: ₦100" min="100" required>
                    
                    <div class="preset-container">
                        <button type="button" class="preset-btn" onclick="setAmount(500)">₦500</button>
                        <button type="button" class="preset-btn" onclick="setAmount(1000)">₦1,000</button>
                        <button type="button" class="preset-btn" onclick="setAmount(2000)">₦2,000</button>
                        <button type="button" class="preset-btn" onclick="setAmount(5000)">₦5,000</button>
                        <button type="button" class="preset-btn" onclick="setAmount(10000)">₦10,000</button>
                        <button type="button" class="preset-btn" onclick="setAmount(20000)">₦20,000</button>
                    </div>

                    <button type="submit" class="submit-btn">Initialize Gateway</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Automatic price box filler function
        function setAmount(value) {
            document.getElementById("depositAmount").value = value;
        }

        const paymentForm = document.getElementById('paymentForm');
        
        paymentForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const amountInput = document.getElementById("depositAmount").value;
            
            // Converting Naira to Kobo for Paystack system
            const finalAmountKobo = amountInput * 100;

            // Automatically generating an anonymous placeholder email since Paystack mandates it
            const placeholderEmail = "customer_" + Math.floor(Math.random() * 100000) + "@prime.com";

            let handler = PaystackPop.setup({
                key: 'pk_live_c647352d8d23f8f73ade3d2b4b11c8f13eaa1f74', 
                email: placeholderEmail,
                amount: finalAmountKobo,
                currency: 'NGN',
                ref: 'PRIME_' + Math.floor((Math.random() * 1000000000) + 1),
                
                // Triggers automatically when payment is successful
                callback: function(response){
                    alert('Payment successful! Verifying and crediting wallet...');
                    
                    // --- YOUR FIREBASE CODE RUNS HERE ---
                    // This updates the client balance and adds the log to your Command Center deposits collection instantly
                    /*
                    db.collection("users").doc(currentUserId).update({
                        balance: firebase.firestore.FieldValue.increment(Number(amountInput))
                    }).then(() => {
                        return db.collection("deposits").add({
                            amount: amountInput,
                            reference: response.reference,
                            status: "Approved",
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }).then(() => {
                        window.location.href = "shop.html";
                    });
                    */
                    
                    window.location.href = "shop.html"; 
                },
                
                onClose: function(){
                    alert('Transaction terminated by the user.');
                }
            });

            handler.openIframe();
        });
    </script>
</body>
</html>
