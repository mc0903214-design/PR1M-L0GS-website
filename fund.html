<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet | PR1MΞ</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --dark-bg: #0a0a0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 5px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--neon-cyan);
            font-size: 1.3rem;
            margin-right: 15px;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 0.8; }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Balance Card Styling */
        .balance-card {
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.06), rgba(0, 243, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .balance-info h3 { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            color: #666; 
            letter-spacing: 0.8px; 
            font-weight: 600;
        }
        .balance-amount { 
            font-size: 1.7rem; 
            font-weight: 500; 
            margin-top: 4px; 
            color: white; 
            letter-spacing: -0.5px;
        }
        
        .visibility-toggle {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .visibility-toggle:hover { background: rgba(255, 255, 255, 0.08); }

        .fund-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #888;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-weight: 500;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 15px 14px 35px;
            border-radius: 10px;
            color: white;
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--neon-cyan); }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ccc;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: border-color 0.2s, color 0.2s;
        }

        .amount-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .fund-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(0, 243, 255, 0.15);
            transition: opacity 0.2s;
        }
        .fund-btn:hover { opacity: 0.9; }

        /* --- CUSTOM TOAST NOTIFICATION SYSTEM --- */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10, 10, 12, 0.95);
            border: 1px solid var(--neon-cyan);
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 10000;
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            white-space: nowrap;
        }
        .toast-notification.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-notification.error-toast {
            border-color: #ff4d4d;
            box-shadow: 0 8px 32px rgba(255, 77, 77, 0.15);
        }

        /* Popup Styling */
        #confirmModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #121218;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-content h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; color: var(--neon-cyan); }
        .modal-content p { color: #aaa; margin-bottom: 20px; line-height: 1.45; font-size: 0.85rem; }

        .modal-btns { display: flex; flex-direction: column; gap: 8px; }
        .modal-proceed { background: var(--neon-cyan); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .modal-cancel { background: transparent; color: #ff4d4d; border: none; padding: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 500; }

        .history-title { font-size: 0.85rem; margin-bottom: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .transaction-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 2px solid var(--neon-purple);
            border-top: 1px solid rgba(255,255,255,0.01);
            border-right: 1px solid rgba(255,255,255,0.01);
            border-bottom: 1px solid rgba(255,255,255,0.01);
        }

        .transaction-item h5 { font-size: 0.95rem; font-weight: 500; color: #fff; letter-spacing: -0.2px; }
        .transaction-item p { font-size: 0.7rem; color: #555; margin-top: 2px; }

        .status-badge { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.3px; }
        .status-badge.success { background: rgba(0, 255, 136, 0.08); color: #00ff88; }

        /* --- UX STATES --- */
        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state, .error-state {
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            padding: 24px 0;
            font-weight: 500;
        }
        .error-state { color: rgba(255, 77, 77, 0.6); }
    </style>
</head>
<body>

    <div id="confirmModal">
        <div class="modal-content">
            <h2>Confirm Transaction</h2>
            <p id="confirmMsg">You are about to deposit ₦500 via Paystack. You will be redirected securely to finalize your transaction.</p>
            <div class="modal-btns">
                <button class="modal-proceed" id="finalProceed">PROCEED TO PAYMENT</button>
                <button class="modal-cancel" onclick="closeModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-notification"></div>

    <div class="container">
        <div class="header">
            <a href="shop.html" class="back-btn">←</a>
            <h2>Add Funds</h2>
        </div>

        <div class="balance-card">
            <div class="balance-info">
                <h3>Your Balance</h3>
                <div class="balance-amount" id="balanceDisplay">₦0.00</div>
            </div>
            <button class="visibility-toggle" onclick="toggleBalance()">👁️</button>
        </div>

        <div class="fund-card">
            <label>Enter Deposit Amount</label>
            <div class="input-group">
                <span>₦</span>
                <input type="number" id="amount" placeholder="100" min="100">
            </div>

            <div class="quick-amounts">
                <button class="amount-btn" onclick="setAmount(500)">₦500</button>
                <button class="amount-btn" onclick="setAmount(1000)">₦1,000</button>
                <button class="amount-btn" onclick="setAmount(2000)">₦2,000</button>
                <button class="amount-btn" onclick="setAmount(5000)">₦5,000</button>
                <button class="amount-btn" onclick="setAmount(10000)">₦10,000</button>
                <button class="amount-btn" onclick="setAmount(20000)">₦20,000</button>
            </div>

            <button class="fund-btn" id="payButton">PROCEED TO CHECKOUT</button>
        </div>

        <h4 class="history-title">Recent Deposits</h4>
        <div id="transactionList">
            <div class="loading-state"><div class="spinner"></div></div>
        </div>
    </div>

    <script>
        let isHidden = false;
        let realBalance = 0;

        function setAmount(val) { document.getElementById('amount').value = val; }
        
        function toggleBalance() {
            const display = document.getElementById('balanceDisplay');
            const btn = document.querySelector('.visibility-toggle');
            isHidden = !isHidden;
            display.innerText = isHidden ? "••••••" : `₦${realBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            btn.innerText = isHidden ? "👁️" : "🙈";
        }

        function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }
        window.closeModal = closeModal;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, addDoc, collection, serverTimestamp, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cached UI Elements
        const toastContainer = document.getElementById('toast-container');
        const transactionList = document.getElementById('transactionList');
        const balanceDisplay = document.getElementById('balanceDisplay');

        let currentUser = null;
        let toastTimeout;

        function showNotification(message, isError = false) {
            clearTimeout(toastTimeout);
            toastContainer.innerText = message;
            if(isError) {
                toastContainer.classList.add('error-toast');
            } else {
                toastContainer.classList.remove('error-toast');
            }
            toastContainer.classList.add('active');
            toastTimeout = setTimeout(() => {
                toastContainer.classList.remove('active');
            }, 3500);
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;

                // Load initial cached balance if available to prevent flash/flicker
                const cachedBal = sessionStorage.getItem('cached_balance');
                if (cachedBal !== null) {
                    realBalance = parseFloat(cachedBal);
                    if (!isHidden) balanceDisplay.innerText = `₦${realBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                }

                // Live Dynamic Balance Synchronization Listener
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if(docSnap.exists()) {
                        const nextBal = docSnap.data().balance || 0;
                        if(nextBal !== realBalance || balanceDisplay.innerText === "₦0.00") {
                            realBalance = nextBal;
                            if (!isHidden) balanceDisplay.innerText = `₦${realBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                            sessionStorage.setItem('cached_balance', realBalance);
                        }
                    }
                });
                loadTransactions(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        document.getElementById('payButton').addEventListener('click', () => {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount < 100) return showNotification("Minimum allocation is ₦100", true);
            
            document.getElementById('confirmMsg').innerText = `You are about to deposit ₦${amount.toLocaleString(undefined, {minimumFractionDigits: 2})} via Paystack. You will be redirected securely to finalize your transaction.`;
            document.getElementById('confirmModal').style.display = 'flex';
        });

        document.getElementById('finalProceed').addEventListener('click', () => {
            window.closeModal();
            const amount = parseFloat(document.getElementById('amount').value);

            try {
                const handler = PaystackPop.setup({
                    key: 'pk_live_c647352d8d23f8f73ade3d2b4b11c8f13eaa1f74',
                    email: currentUser.email,
                    amount: Math.round(amount * 100),
                    currency: "NGN",
                    callback: function(response) {
                        window.handleSuccess(amount, response.reference);
                    },
                    onClose: function() {
                        showNotification("Payment interface dismissed.", false);
                    }
                });
                handler.openIframe();
            } catch (err) {
                showNotification("Unable to initialize payment gateway. Please verify network access.", true);
            }
        });

        async function handleSuccess(amount, ref) {
            try {
                await addDoc(collection(db, "deposits"), {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    amount: amount,
                    reference: ref,
                    status: "success",
                    timestamp: serverTimestamp()
                });

                await updateDoc(doc(db, "users", currentUser.uid), { balance: increment(amount) });
                showNotification("Wallet initialized and funded successfully!");
            } catch (e) {
                showNotification("Payment recorded. Sync adjustment required. Support Code: " + ref, true);
            }
        }
        
        window.handleSuccess = handleSuccess;

        function loadTransactions(uid) {
            // Firestore Query Engine matching operational bounds
            const q = query(collection(db, "deposits"), where("uid", "==", uid), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    transactionList.innerHTML = `<div class="empty-state">No previous deposits found.</div>`;
                    return;
                }
                
                // Fast String Batch Concatenation to mitigate heavy single-loop micro-reflow patterns
                let fragmentHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const formattedAmt = (data.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    const safeRef = data.reference || "-------";
                    const safeStatus = data.status || "success";
                    
                    fragmentHTML += `
                        <div class="transaction-item">
                            <div>
                                <h5>₦${formattedAmt}</h5>
                                <p>${safeRef}</p>
                            </div>
                            <span class="status-badge success">${safeStatus}</span>
                        </div>
                    `;
                });
                
                transactionList.innerHTML = fragmentHTML;
            }, (error) => {
                // Gracefully intercept incomplete Firestore configurations or unindexed complex parameters
                if (error.code === 'failed-precondition' || error.message.indexOf('index') > -1) {
                    transactionList.innerHTML = `<div class="error-state">Transaction updates currently unavailable. Try again later.</div>`;
                    showNotification("Database operational constraint detected. Index building required.", true);
                } else {
                    transactionList.innerHTML = `<div class="error-state">Unable to load transactions right now.</div>`;
                    showNotification("Network sync failed. Please check your web connection.", true);
                }
            });
        }
    </script>
</body>
</html>
