<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet | PR1MΞ</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --dark-bg: #060608;
            --dashboard-blue: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --accent-glow: rgba(0, 243, 255, 0.15);
            --stock-red: #ff4b4b;
            --stock-green: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f1f3;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(188, 19, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0d0d16 0%, #060608 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding: 4px 8px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            margin-right: 16px;
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid var(--glass-border); 
            border-radius: 12px;
            width: 38px;
            height: 38px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s ease; 
        }
        .back-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: rgba(255, 255, 255, 0.2);
        }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        /* Balance Card Redesign */
        .balance-card {
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.4) 0%, rgba(42, 82, 152, 0.2) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(58, 118, 240, 0.3);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .balance-card::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .balance-info h3 { 
            font-size: 0.85rem;
            font-weight: 500;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-amount { 
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 6px;
            display: flex;
            align-items: center;
            min-height: 44px;
            letter-spacing: -0.5px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .visibility-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            z-index: 2;
        }
        .visibility-toggle:hover { 
            background: rgba(255, 255, 255, 0.12); 
            border-color: rgba(255, 255, 255, 0.25); 
        }

        /* Funding Interactive Panel Redesign */
        .fund-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        label {
            display: block;
            font-size: 0.8rem; 
            color: #718096; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 12px; 
            padding-left: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group span {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 1.2rem;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 16px 16px 16px 42px;
            border-radius: 14px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #a0aec0;
            padding: 12px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .amount-btn:hover { 
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--neon-cyan); 
            color: #fff; 
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .fund-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, var(--neon-purple) 0%, #9d4edd 100%);
            color: white;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(188, 19, 254, 0.3);
            transition: all 0.2s ease;
        }
        .fund-btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(188, 19, 254, 0.45);
            opacity: 0.95;
        }

        /* Custom Popup Overlay Modals */
        #confirmModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: rgba(14, 14, 18, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 24px;
            padding: 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .modal-content h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; color: #fff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .modal-content p { color: #cbd5e0; margin-bottom: 24px; line-height: 1.5; font-size: 0.9rem; }

        .modal-btns { display: flex; flex-direction: column; gap: 10px; }
        .modal-proceed { 
            background: #fff; 
            color: #060608; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .modal-proceed:hover {
            background: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .modal-cancel { background: transparent; color: #ff4d4d; border: none; padding: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .modal-cancel:hover { opacity: 0.8; }

        /* Ledger Transactions Redesign */
        .history-title { 
            font-size: 0.8rem; 
            color: #718096; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 16px; 
            padding-left: 4px; 
        }

        .transaction-item {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--neon-purple);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            animation: itemFade 0.3s ease-out forwards;
        }
        @keyframes itemFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .transaction-item h5 { font-size: 1rem; font-weight: 700; color: #e2e8f0; letter-spacing: -0.2px; }
        .transaction-item p { font-size: 0.75rem; color: #718096; margin-top: 4px; font-family: monospace; }

        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        
        /* Updated dynamic badge styling based on target class states */
        .status-badge.success, .status-badge.approved { background: rgba(0, 255, 136, 0.08); color: var(--stock-green); border: 1px solid rgba(0, 255, 136, 0.15); }
        .status-badge.declined, .status-badge.failed { background: rgba(255, 75, 75, 0.08); color: var(--stock-red); border: 1px solid rgba(255, 75, 75, 0.15); }

        /* Custom System Notifications Styling */
        .toast-notification {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10, 10, 14, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--neon-cyan);
            padding: 14px 28px;
            border-radius: 14px;
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            white-space: nowrap;
        }
        .toast-notification.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-notification.error-toast { border-color: #ff4d4d; box-shadow: 0 8px 32px rgba(255, 77, 77, 0.2); }

        /* Processing Layout States */
        .loading-state { display: flex; justify-content: center; align-items: center; padding: 32px 0; }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2.5px solid rgba(255,255,255,0.15);
            border-top: 2.5px solid var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state, .error-state {
            text-align: center;
            color: #718096;
            font-size: 0.85rem;
            padding: 32px 0;
            font-weight: 500;
            border: 1px dashed var(--glass-border);
            border-radius: 16px;
        }
        .error-state { color: #ff4b4b; border-color: rgba(255, 75, 75, 0.2); }
    </style>
</head>
<body>

    <div id="confirmModal">
        <div class="modal-content">
            <h2>Confirm Transaction</h2>
            <p id="confirmMsg">You are about to deposit ₦500 via Paystack. You will be redirected securely to finalize your transaction.</p>
            <div class="modal-btns">
                <button class="modal-proceed" id="finalProceed">PROCEED TO PAYMENT</button>
                <button class="modal-cancel" onclick="closeModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-notification"></div>

    <div class="container">
        <div class="header">
            <a href="shop.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h2>Add Funds</h2>
        </div>

        <div class="balance-card">
            <div class="balance-info">
                <h3>Your Balance</h3>
                <div class="balance-amount" id="balanceDisplay">₦0.00</div>
            </div>
            <button class="visibility-toggle" onclick="toggleBalance()">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>

        <div class="fund-card">
            <label>Enter Deposit Amount</label>
            <div class="input-group">
                <span>₦</span>
                <input type="number" id="amount" placeholder="100" min="100">
            </div>

            <div class="quick-amounts">
                <button class="amount-btn" onclick="setAmount(500)">₦500</button>
                <button class="amount-btn" onclick="setAmount(1000)">₦1,000</button>
                <button class="amount-btn" onclick="setAmount(2000)">₦2,000</button>
                <button class="amount-btn" onclick="setAmount(5000)">₦5,000</button>
                <button class="amount-btn" onclick="setAmount(10000)">₦10,000</button>
                <button class="amount-btn" onclick="setAmount(20000)">₦20,000</button>
            </div>

            <button class="fund-btn" id="payButton">PROCEED TO CHECKOUT</button>
        </div>

        <h4 class="history-title">Recent Deposits</h4>
        <div id="transactionList">
            <div class="loading-state"><div class="spinner"></div></div>
        </div>
    </div>

    <script>
        let isHidden = false;
        let realBalance = 0;

        function setAmount(val) { document.getElementById('amount').value = val; }
        
        function toggleBalance() {
            const display = document.getElementById('balanceDisplay');
            const eyeIcon = document.getElementById('eye-icon');
            isHidden = !isHidden;
            
            if (isHidden) {
                display.innerText = "••••••";
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                display.innerText = `₦${realBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }
        window.closeModal = closeModal;
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, addDoc, collection, serverTimestamp, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cached UI Elements
        const toastContainer = document.getElementById('toast-container');
        const transactionList = document.getElementById('transactionList');
        const balanceDisplay = document.getElementById('balanceDisplay');

        let currentUser = null;
        let toastTimeout;

        function showNotification(message, isError = false) {
            clearTimeout(toastTimeout);
            toastContainer.innerText = message;
            if(isError) {
                toastContainer.classList.add('error-toast');
            } else {
                toastContainer.classList.remove('error-toast');
            }
            toastContainer.classList.add('active');
            toastTimeout = setTimeout(() => {
                toastContainer.classList.remove('active');
            }, 3500);
        }

        // Export utility to window namespace for local script interface access
        window.showNotification = showNotification;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;

                // Load initial cached balance if available to prevent flash/flicker
                const cachedBal = sessionStorage.getItem('cached_balance');
                if (cachedBal !== null) {
                    realBalance = parseFloat(cachedBal);
                    if (!isHidden) balanceDisplay.innerText = `₦${realBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                }

                // Live Dynamic Balance Synchronization Listener
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if(docSnap.exists()) {
                        const nextBal = docSnap.data().balance || 0;
                        if(nextBal !== realBalance || balanceDisplay.innerText === "₦0.00") {
                            realBalance = nextBal;
                            if (!isHidden) balanceDisplay.innerText = `₦${realBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                            sessionStorage.setItem('cached_balance', realBalance);
                        }
                    }
                });
                loadTransactions(user.uid);
            } else {
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        });

        document.getElementById('payButton').addEventListener('click', () => {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount < 100) return showNotification("Minimum allocation is ₦100", true);
            
            document.getElementById('confirmMsg').innerText = `You are about to deposit ₦${amount.toLocaleString(undefined, {minimumFractionDigits: 2})} via Paystack. You will be redirected securely to finalize your transaction.`;
            document.getElementById('confirmModal').style.display = 'flex';
        });

        document.getElementById('finalProceed').addEventListener('click', () => {
            window.closeModal();
            const amount = parseFloat(document.getElementById('amount').value);

            if (!currentUser) {
                return showNotification("Please wait...", true);
            }

            if (typeof PaystackPop === 'undefined') {
                return showNotification("Paystack failed to load", true);
            }

            try {
                const handler = PaystackPop.setup({
                    key: 'pk_live_c647352d8d23f8f73ade3d2b4b11c8f13eaa1f74',
                    email: currentUser.email,
                    amount: Math.round(amount * 100),
                    currency: "NGN",
                    callback: function(response) {
                        window.handleSuccess(amount, response.reference);
                    },
                    onClose: function() {
                        showNotification("Payment interface dismissed.", false);
                    }
                });
                handler.openIframe();
            } catch (err) {
                console.error("Paystack initialization failed error trace:", err);
                showNotification("Unable to initialize payment gateway. Please verify network access.", true);
            }
        });

        async function handleSuccess(amount, ref) {
            try {
                await addDoc(collection(db, "deposits"), {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    amount: amount,
                    reference: ref,
                    status: "success",
                    timestamp: serverTimestamp()
                });

                await updateDoc(doc(db, "users", currentUser.uid), { balance: increment(amount) });
                showNotification("Wallet initialized and funded successfully!");
            } catch (e) {
                console.error("Firestore balance sync failed error trace:", e);
                showNotification("Payment recorded. Sync adjustment required. Support Code: " + ref, true);
            }
        }
        
        window.handleSuccess = handleSuccess;

        function loadTransactions(uid) {
            // Firestore Query Engine matching operational bounds
            const q = query(collection(db, "deposits"), where("uid", "==", uid), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    transactionList.innerHTML = `<div class="empty-state">No previous deposits found.</div>`;
                    return;
                }
                
                // Fast String Batch Concatenation to mitigate heavy single-loop micro-reflow patterns
                let fragmentHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const formattedAmt = (data.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    const safeRef = data.reference || "-------";
                    const safeStatus = data.status || "success";
                    
                    // Normalize down strings to assign class mappings cleanly
                    const statusClass = safeStatus.toLowerCase();
                    
                    fragmentHTML += `
                        <div class="transaction-item">
                            <div>
                                <h5>₦${formattedAmt}</h5>
                                <p>${safeRef}</p>
                            </div>
                            <span class="status-badge ${statusClass}">${safeStatus}</span>
                        </div>
                    `;
                });
                
                transactionList.innerHTML = fragmentHTML;
            }, (error) => {
                console.error("Transaction subscription runtime fault:", error);
                // Gracefully intercept incomplete Firestore configurations or unindexed complex parameters
                if (error.code === 'failed-precondition' || error.message.indexOf('index') > -1) {
                    transactionList.innerHTML = `<div class="error-state">Transaction updates currently unavailable. Try again later.</div>`;
                    showNotification("Database operational constraint detected. Index building required.", true);
                } else {
                    transactionList.innerHTML = `<div class="error-state">Unable to load transactions right now.</div>`;
                    showNotification("Network sync failed. Please check your web connection.", true);
                }
            });
        }
    </script>
</body>
</html>
