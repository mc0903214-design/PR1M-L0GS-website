<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet | PR1MΞ</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --dark-bg: #0a0a0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--neon-cyan);
            font-size: 1.2rem;
            margin-right: 15px;
        }

        .fund-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-weight: bold;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 15px 15px 40px;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--neon-cyan); }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .amount-btn:hover { background: var(--neon-cyan); color: #000; }

        .fund-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
        }

        .history-title { font-size: 1rem; margin-bottom: 15px; color: var(--neon-cyan); }

        .transaction-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--neon-purple);
        }

        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .status-badge.success { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .status-badge.pending { background: rgba(255, 187, 0, 0.1); color: #ffbb00; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="shop.html" class="back-btn">←</a>
            <h2>Add Funds</h2>
        </div>

        <div class="fund-card">
            <label>Enter Deposit Amount</label>
            <div class="input-group">
                <span>₦</span>
                <input type="number" id="amount" placeholder="100" min="100">
            </div>

            <div class="quick-amounts">
                <button class="amount-btn" onclick="setAmount(500)">₦500</button>
                <button class="amount-btn" onclick="setAmount(1000)">₦1,000</button>
                <button class="amount-btn" onclick="setAmount(5000)">₦5,000</button>
            </div>

            <button class="fund-btn" id="payButton">PROCEED TO CHECKOUT</button>
        </div>

        <h4 class="history-title">Recent Deposits</h4>
        <div id="transactionList"></div>
    </div>

    <script>
        function setAmount(val) { document.getElementById('amount').value = val; }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, increment, addDoc, collection, serverTimestamp, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadTransactions(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        document.getElementById('payButton').addEventListener('click', () => {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount < 100) return alert("Minimum is ₦100");

            const handler = PaystackPop.setup({
                key: 'pk_live_c647352d8d23f8f73ade3d2b4b11c8f13eaa1f74',
                email: currentUser.email,
                amount: amount * 100, // Paystack works in Kobo
                currency: "NGN",
                callback: function(response) {
                    handleSuccess(amount, response.reference);
                },
                onClose: function() {
                    alert("Transaction closed.");
                }
            });
            handler.openIframe();
        });

        async function handleSuccess(amount, ref) {
            try {
                // 1. Record the deposit
                await addDoc(collection(db, "deposits"), {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    amount: amount,
                    reference: ref,
                    status: "success",
                    timestamp: serverTimestamp()
                });

                // 2. Update user balance
                const userRef = doc(db, "users", currentUser.uid);
                await updateDoc(userRef, { balance: increment(amount) });

                // 3. Clear local balance cache so shop.html updates immediately
                sessionStorage.removeItem('cached_balance');

                alert("Wallet Funded!");
                window.location.href = "shop.html";
            } catch (e) {
                alert("Error updating wallet. Keep your reference: " + ref);
            }
        }

        function loadTransactions(uid) {
            const q = query(collection(db, "deposits"), where("uid", "==", uid), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('transactionList');
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `
                        <div class="transaction-item">
                            <div>
                                <h5>₦${data.amount.toLocaleString()}</h5>
                                <p style="font-size:0.7rem; color:#666">${data.reference}</p>
                            </div>
                            <span class="status-badge success">Success</span>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
