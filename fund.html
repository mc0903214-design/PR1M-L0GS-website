<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet | PR1MΞ</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --dark-bg: #0a0a0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--neon-cyan);
            font-size: 1.2rem;
            margin-right: 15px;
        }

        /* Balance Card Styling */
        .balance-card {
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.1), rgba(0, 243, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .balance-info h3 { font-size: 0.8rem; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .balance-amount { font-size: 1.8rem; font-weight: 800; margin-top: 5px; color: white; }
        
        .visibility-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--neon-cyan);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .fund-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-weight: bold;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 15px 15px 40px;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--neon-cyan); }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .amount-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .fund-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
        }

        /* Popup Styling */
        #confirmModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #121218;
            border: 1px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .modal-content h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--neon-cyan); }
        .modal-content p { color: #ccc; margin-bottom: 25px; line-height: 1.5; font-size: 0.95rem; }

        .modal-btns { display: flex; flex-direction: column; gap: 10px; }
        .modal-proceed { background: var(--neon-cyan); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .modal-cancel { background: transparent; color: #ff4d4d; border: none; padding: 10px; cursor: pointer; font-size: 0.85rem; }

        .history-title { font-size: 1rem; margin-bottom: 15px; color: var(--neon-cyan); }

        .transaction-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--neon-purple);
        }

        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .status-badge.success { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
    </style>
</head>
<body>

    <div id="confirmModal">
        <div class="modal-content">
            <h2>Confirm Wallet Funding</h2>
            <p id="confirmMsg">You are about to fund your wallet with ₦500 via Paystack. You will be redirected to complete payment.</p>
            <div class="modal-btns">
                <button class="modal-proceed" id="finalProceed">PROCEED TO PAYMENT</button>
                <button class="modal-cancel" onclick="closeModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <a href="shop.html" class="back-btn">←</a>
            <h2>Add Funds</h2>
        </div>

        <div class="balance-card">
            <div class="balance-info">
                <h3>Your Balance</h3>
                <div class="balance-amount" id="balanceDisplay">₦0.00</div>
            </div>
            <button class="visibility-toggle" onclick="toggleBalance()">HIDE</button>
        </div>

        <div class="fund-card">
            <label>Enter Deposit Amount</label>
            <div class="input-group">
                <span>₦</span>
                <input type="number" id="amount" placeholder="100" min="100">
            </div>

            <div class="quick-amounts">
                <button class="amount-btn" onclick="setAmount(500)">₦500</button>
                <button class="amount-btn" onclick="setAmount(1000)">₦1,000</button>
                <button class="amount-btn" onclick="setAmount(2000)">₦2,000</button>
                <button class="amount-btn" onclick="setAmount(5000)">₦5,000</button>
                <button class="amount-btn" onclick="setAmount(10000)">₦10,000</button>
                <button class="amount-btn" onclick="setAmount(20000)">₦20,000</button>
            </div>

            <button class="fund-btn" id="payButton">PROCEED TO CHECKOUT</button>
        </div>

        <h4 class="history-title">Recent Deposits</h4>
        <div id="transactionList"></div>
    </div>

    <script>
        let isHidden = false;
        let realBalance = 0;

        function setAmount(val) { document.getElementById('amount').value = val; }
        
        function toggleBalance() {
            const display = document.getElementById('balanceDisplay');
            const btn = document.querySelector('.visibility-toggle');
            isHidden = !isHidden;
            display.innerText = isHidden ? "₦ ••••••" : `₦${realBalance.toLocaleString()}`;
            btn.innerText = isHidden ? "SHOW" : "HIDE";
        }

        function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, addDoc, collection, serverTimestamp, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Live Balance Listener
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    if(doc.exists()) {
                        realBalance = doc.data().balance || 0;
                        if (!isHidden) document.getElementById('balanceDisplay').innerText = `₦${realBalance.toLocaleString()}`;
                    }
                });
                loadTransactions(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        document.getElementById('payButton').addEventListener('click', () => {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount < 100) return alert("Minimum is ₦100");
            
            document.getElementById('confirmMsg').innerText = `You are about to fund your wallet with ₦${amount.toLocaleString()} via Paystack. You will be redirected to complete payment.`;
            document.getElementById('confirmModal').style.display = 'flex';
        });

        document.getElementById('finalProceed').addEventListener('click', () => {
            closeModal();
            const amount = parseFloat(document.getElementById('amount').value);

            try {
                const handler = PaystackPop.setup({
                    key: 'pk_live_c647352d8d23f8f73ade3d2b4b11c8f13eaa1f74',
                    email: currentUser.email,
                    amount: Math.round(amount * 100),
                    currency: "NGN",
                    callback: function(response) {
                        handleSuccess(amount, response.reference);
                    }
                });
                handler.openIframe();
            } catch (err) {
                alert("Payment gateway error.");
            }
        });

        async function handleSuccess(amount, ref) {
            try {
                await addDoc(collection(db, "deposits"), {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    amount: amount,
                    reference: ref,
                    status: "success",
                    timestamp: serverTimestamp()
                });

                await updateDoc(doc(db, "users", currentUser.uid), { balance: increment(amount) });
                alert("Wallet Funded Successfully!");
            } catch (e) {
                alert("Payment successful but database update failed. Contact support with Ref: " + ref);
            }
        }

        function loadTransactions(uid) {
            const q = query(collection(db, "deposits"), where("uid", "==", uid), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('transactionList');
                list.innerHTML = "";
                if(snapshot.empty) list.innerHTML = `<p style="text-align:center; color:#444; font-size:0.8rem">No previous deposits found.</p>`;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `
                        <div class="transaction-item">
                            <div>
                                <h5>₦${data.amount.toLocaleString()}</h5>
                                <p style="font-size:0.7rem; color:#666">${data.reference}</p>
                            </div>
                            <span class="status-badge success">${data.status}</span>
                        </div>
                    `;
                });
            }, (error) => {
                console.log("Error fetching deposits:", error);
            });
        }
    </script>
</body>
</html>
