<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet | PR1MΞ</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --dark-bg: #0a0a0c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--neon-cyan);
            font-size: 1.5rem;
            margin-right: 15px;
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .option-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .option-card:active {
            border-color: var(--neon-purple);
            transform: scale(0.98);
        }

        .option-icon {
            font-size: 1.8rem;
            margin-right: 15px;
        }

        .option-info h4 {
            color: var(--neon-cyan);
            margin-bottom: 4px;
        }

        .option-info p {
            font-size: 0.75rem;
            color: #888;
        }

        .step-container {
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #ccc;
        }

        input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
        }

        .bank-details-box {
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .pay-exactly {
            color: #ffcc00;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* --- TRANSACTION LIST --- */
        .history-section {
            margin-top: 40px;
        }

        .history-title {
            font-size: 0.9rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .transaction-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tx-info h5 { font-size: 0.9rem; color: #eee; }
        .tx-info p { font-size: 0.7rem; color: #666; }
        
        .status-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .pending { color: #ffcc00; background: rgba(255, 204, 0, 0.1); }
        .approved { color: #00ff88; background: rgba(0, 255, 136, 0.1); }
        .declined { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <a href="shop.html" class="back-btn">←</a>
        <h2 id="page-title">Fund Wallet</h2>
    </div>

    <!-- 1. Selection Screen -->
    <div id="selectionScreen">
        <div class="option-card" onclick="showAmountStep()">
            <div class="option-icon">🏦</div>
            <div class="option-info">
                <h4>Bank Transfer</h4>
                <p>Manual approval by Admin</p>
            </div>
        </div>

        <div class="option-card" onclick="showCryptoFlow()">
            <div class="option-icon">₿</div>
            <div class="option-info">
                <h4>Crypto Payment</h4>
                <p>Automated via NOWPayments</p>
            </div>
        </div>
    </div>

    <!-- 2. Step 1: Enter Amount -->
    <div id="amountStep" class="hidden">
        <div class="step-container">
            <label>How much do you want to deposit? (₦)</label>
            <input type="number" id="depositAmount" placeholder="Min: ₦500" min="500">
            <button class="submit-btn" onclick="showBankDetails()">Continue to Details</button>
            <p onclick="location.reload()" style="text-align:center; margin-top:20px; font-size:0.8rem; color:var(--neon-cyan); cursor:pointer;">← Go Back</p>
        </div>
    </div>

    <!-- 3. Step 2: Bank Details & Upload -->
    <div id="bankFlow" class="hidden">
        <div class="step-container">
            <span class="pay-exactly">PAY EXACTLY: ₦<span id="displayAmount">0</span></span>
            
            <label>Transfer to the following account:</label>
            <div class="bank-details-box">
                <strong>BANK:</strong> MONIEPOINT<br>
                <strong>ACC NO:</strong> 9032140540<br>
                <strong>NAME:</strong> CHRISTOPHER MICHAEL
            </div>

            <label>Upload Payment Receipt (Screenshot)</label>
            <input type="file" id="receipt" accept="image/*">

            <button class="submit-btn" id="submitBtn" onclick="submitToAdmin()">Submit for Approval</button>
        </div>
    </div>

    <!-- 4. Crypto Flow -->
    <div id="cryptoFlow" class="hidden">
        <div style="text-align:center; padding: 40px 0;">
            <h3>Redirecting to Secure Gateway...</h3>
            <p style="color:#666; margin-top:10px;">NOWPayments initialization.</p>
        </div>
    </div>

    <!-- 5. Transaction History -->
    <div class="history-section">
        <div class="history-title">Recent Transactions</div>
        <div id="transactionList">
            <!-- Loaded via JS -->
            <p style="color:#444; font-size:0.8rem; text-align:center;">Loading history...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userUID = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userUID = user.uid;
                loadTransactions(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        window.showAmountStep = function() {
            document.getElementById('selectionScreen').classList.add('hidden');
            document.getElementById('amountStep').classList.remove('hidden');
        }

        window.showBankDetails = function() {
            const amt = document.getElementById('depositAmount').value;
            if (!amt || amt < 500) return alert("Minimum deposit is ₦500");
            
            document.getElementById('displayAmount').innerText = parseFloat(amt).toLocaleString();
            document.getElementById('amountStep').classList.add('hidden');
            document.getElementById('bankFlow').classList.remove('hidden');
            document.getElementById('page-title').innerText = "Submit Receipt";
        }

        window.showCryptoFlow = function() {
            document.getElementById('selectionScreen').classList.add('hidden');
            document.getElementById('cryptoFlow').classList.remove('hidden');
            setTimeout(() => { alert("Crypto payments integrated in next update."); location.reload(); }, 2000);
        }

        window.submitToAdmin = async function() {
            const amt = document.getElementById('depositAmount').value;
            const file = document.getElementById('receipt').files[0];
            const btn = document.getElementById('submitBtn');

            if(!file) return alert("Please upload a receipt screenshot");

            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                // Submit main deposit request
                await addDoc(collection(db, "deposits"), {
                    uid: userUID,
                    email: auth.currentUser.email,
                    amount: parseFloat(amt),
                    status: "pending",
                    type: "Bank Transfer",
                    timestamp: serverTimestamp()
                });

                // ALERT ADMIN BOT via logs collection
                await addDoc(collection(db, "logs"), {
                    type: "DEPOSIT_REQUEST",
                    details: `New Bank Deposit request from ${auth.currentUser.email} for ₦${amt}`,
                    timestamp: serverTimestamp()
                });

                alert("Submitted! Please wait for Admin approval.");
                location.reload();
            } catch (e) {
                alert("Submission failed.");
                btn.disabled = false;
            }
        }

        function loadTransactions(uid) {
            const q = query(collection(db, "deposits"), where("uid", "==", uid), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('transactionList');
                if (snapshot.empty) {
                    list.innerHTML = '<p style="color:#444; font-size:0.8rem; text-align:center;">No recent deposits found.</p>';
                    return;
                }
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'Just now';
                    list.innerHTML += `
                        <div class="transaction-item">
                            <div class="tx-info">
                                <h5>₦${data.amount.toLocaleString()}</h5>
                                <p>${data.type} • ${date}</p>
                            </div>
                            <span class="status-badge ${data.status}">${data.status}</span>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
