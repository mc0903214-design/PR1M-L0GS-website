<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM History - PR1MΞ Market</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-border: rgba(255,255,255,.08);
            --dark-bg: #060608;
            --stock-green: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: #060608;
            color: #f1f1f3;
            min-height: 100vh;
            padding: 24px 16px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 20px;
        }

        .back-btn {
            background: rgba(255,255,255,.04);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-card {
            background: rgba(255,255,255,.025);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .order-title { font-weight: 700; font-size: .9rem; color: #fff; margin-bottom: 8px; line-height: 1.3; }
        
        .order-link {
            font-size: .78rem;
            color: var(--neon-cyan);
            word-break: break-all;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
        }
        
        .order-link:hover {
            text-decoration: underline;
        }

        .order-meta { 
            font-size: .8rem; 
            color: #a0aec0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 6px; 
        }

        .order-meta:last-child {
            margin-bottom: 0;
            padding-top: 6px;
            border-top: 1px dashed rgba(255,255,255,.05);
        }

        .status-badge {
            font-size: .7rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            display: inline-block;
        }

        /* Status Colors */
        .status-completed, .status-done {
            background: rgba(0,255,136,.12);
            color: var(--stock-green);
            border: 1px solid rgba(0,255,136,.25);
        }

        .status-pending, .status-processing, .status-in_progress, .status-inprogress {
            background: rgba(0,243,255,.12);
            color: var(--neon-cyan);
            border: 1px solid rgba(0,243,255,.25);
        }

        .status-canceled, .status-cancelled, .status-failed {
            background: rgba(255,75,75,.12);
            color: #ff4b4b;
            border: 1px solid rgba(255,75,75,.25);
        }

        .status-partial {
            background: rgba(255,187,0,.12);
            color: #ffbb00;
            border: 1px solid rgba(255,187,0,.25);
        }
    </style>
</head>
<body>

<header>
    <button class="back-btn" onclick="history.back()" aria-label="Go Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    <h1 style="font-size: 1.2rem;">SMM Order History</h1>
</header>

<div id="history-container">
    <div style="text-align:center; padding: 40px; color: #718096;">Loading orders...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
        authDomain: "primelogs-web.firebaseapp.com",
        projectId: "primelogs-web",
        storageBucket: "primelogs-web.firebasestorage.app",
        messagingSenderId: "732956069251",
        appId: "1:732956069251:web:b9c8be37e6db4f98db3ab3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const API_URL = "https://pr1m-l0gs-website-smm-boost.up.railway.app/api/smm";
    const container = document.getElementById('history-container');

    onAuthStateChanged(auth, async user => {
        if (!user) { window.location.href = "index.html"; return; }

        try {
            // Fetch directly by userId to prevent missing composite index errors
            const q = query(
                collection(db, "smmOrders"),
                where("userId", "==", user.uid)
            );

            const snap = await getDocs(q);
            
            if (snap.empty) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#718096;">No orders found.</div>';
                return;
            }

            const orders = [];
            snap.forEach(docSnap => {
                orders.push({ id: docSnap.id, ...docSnap.data() });
            });

            // Client-side sorting by date descending
            orders.sort((a, b) => {
                const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
                const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
                return timeB - timeA;
            });

            // Extract external SMM Order IDs to query real-time status
            const orderIds = orders
                .map(o => o.smmOrderId)
                .filter(id => id !== undefined && id !== null && id !== '');

            let liveStatuses = {};

            if (orderIds.length > 0) {
                try {
                    const statusRes = await fetch(`${API_URL}/status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orders: orderIds.join(',') })
                    });

                    if (statusRes.ok) {
                        liveStatuses = await statusRes.json();
                    }
                } catch (err) {
                    console.error("Could not fetch live SMM status:", err);
                }
            }

            container.innerHTML = '';

            orders.forEach(data => {
                const orderIdStr = String(data.smmOrderId);
                const liveInfo = liveStatuses[orderIdStr] || liveStatuses[data.smmOrderId] || {};

                // Determine display status
                let rawStatus = String(liveInfo.status || data.status || "Pending");
                let displayStatus = rawStatus;

                // Normalize status text
                const lowerStatus = rawStatus.toLowerCase();
                if (lowerStatus === 'completed' || lowerStatus === 'done') {
                    displayStatus = 'Completed';
                } else if (lowerStatus === 'in progress' || lowerStatus === 'inprogress') {
                    displayStatus = 'In Progress';
                } else {
                    displayStatus = rawStatus.charAt(0).toUpperCase() + rawStatus.slice(1);
                }

                const statusClass = `status-${displayStatus.toLowerCase().replace(/\s+/g, '_')}`;

                const rawCharge = data.charge !== undefined ? data.charge : data.totalPaid;
                const formattedCharge = typeof rawCharge === 'number' 
                    ? rawCharge.toFixed(2) 
                    : parseFloat(rawCharge || 0).toFixed(2);

                let orderDate = '';
                if (data.createdAt?.toDate) {
                    orderDate = data.createdAt.toDate().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                }

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-title">${data.serviceName || 'SMM Service'}</div>

                        ${data.link ? `<a href="${data.link}" target="_blank" rel="noopener" class="order-link">${data.link}</a>` : ''}

                        <div class="order-meta">
                            <span>Quantity: <strong>${data.quantity || 0}</strong></span>
                            <span>₦${formattedCharge}</span>
                        </div>

                        ${liveInfo.start_count !== undefined && liveInfo.start_count !== null ? `
                            <div class="order-meta">
                                <span>Start Count: ${liveInfo.start_count}</span>
                                <span>Remains: ${liveInfo.remains !== undefined ? liveInfo.remains : 'N/A'}</span>
                            </div>
                        ` : ''}

                        <div class="order-meta">
                            <span class="status-badge ${statusClass}">${displayStatus}</span>
                            <span>${orderDate ? `${orderDate} • ` : ''}ID: ${data.smmOrderId || 'N/A'}</span>
                        </div>
                    </div>
                `;
            });

        } catch (err) {
            console.error("Firestore History Error:", err);
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#718096;">
                Failed to load order history.<br>
                <small style="font-size:.75rem; opacity:.7;">${err.message || ''}</small>
            </div>`;
        }
    });
</script>
</body>
</html>
