<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Profile</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --dark-bg: #060608;
            --accent-glow: rgba(0, 243, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: #f1f1f3;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(188, 19, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0d0d16 0%, #060608 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .reveal {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px 30px 8px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 12px;
            padding: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        /* --- PROFILE IDENTITY --- */
        .profile-identity {
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar-container {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--glass-border);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .avatar-container svg {
            color: #718096;
        }

        .user-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 0.85rem;
            color: #718096;
        }

        /* --- MENU LIST (MATCHING UPLOADED IMAGE) --- */
        .menu-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: rgba(255, 255, 255, 0.05); }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
        }

        .icon-blue { background: rgba(30, 60, 114, 0.3); color: var(--neon-cyan); }
        .icon-green { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .icon-purple { background: rgba(188, 19, 254, 0.1); color: var(--neon-purple); }
        .icon-red { background: rgba(255, 75, 75, 0.1); color: #ff4b4b; }

        .item-content { flex: 1; }
        .item-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
        .item-sub { font-size: 0.75rem; color: #718096; }

        .chevron { color: #4a5568; margin-left: 8px; }

        /* --- TOP UP BUTTON --- */
        .topup-btn {
            background: linear-gradient(135deg, #4d13fe, #bc13fe);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            margin-left: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(188, 19, 254, 0.3);
            transition: opacity 0.2s;
        }
        .topup-btn:active { opacity: 0.8; }

        /* --- REFERRAL SECTION --- */
        .referral-card {
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.1) 0%, rgba(30, 60, 114, 0.1) 100%);
            border: 1px solid rgba(188, 19, 254, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .ref-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .ref-title { font-size: 0.8rem; font-weight: 700; color: var(--neon-purple); text-transform: uppercase; letter-spacing: 1px; }
        .ref-stats { font-size: 0.8rem; font-weight: 600; color: #fff; }

        .ref-link-container {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px;
            align-items: center;
            margin-top: 15px;
            border: 1px solid var(--glass-border);
        }

        .ref-url { font-size: 0.75rem; color: #a0aec0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .copy-btn { background: var(--neon-cyan); color: #000; border: none; padding: 6px 14px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }

        /* --- TOAST --- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--neon-cyan);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <header class="reveal">
        <a href="shop.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <div style="font-weight: 700; letter-spacing: 1px; color: var(--neon-cyan);">PROFILE</div>
        <div style="width: 40px;"></div>
    </header>

    <div class="profile-identity reveal">
        <div class="avatar-container">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <div class="user-name" id="user-username">Loading...</div>
        <div class="user-email" id="user-email">...</div>
    </div>

    <div class="menu-container reveal">
        <div class="menu-item">
            <div class="icon-box icon-blue">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
            </div>
            <div class="item-content">
                <div class="item-title">Account Balance</div>
                <div class="item-sub" id="user-balance">NGN 0.00</div>
            </div>
            <a href="fund.html" class="topup-btn">+ Top up</a>
        </div>

        <a href="mine.html" class="menu-item">
            <div class="icon-box icon-green">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            </div>
            <div class="item-content">
                <div class="item-title">Purchase History</div>
                <div class="item-sub" id="order-count">0 orders total</div>
            </div>
            <div class="chevron">›</div>
        </a>

        <a href="javascript:void(0)" class="menu-item" id="logout-btn">
            <div class="icon-box icon-red">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </div>
            <div class="item-content" style="color: #ff4b4b;">
                <div class="item-title">Log Out</div>
                <div class="item-sub" style="color: rgba(255,75,75,0.6);">Click Here to Log Out</div>
            </div>
            <div class="chevron">›</div>
        </a>
    </div>

    <div class="referral-card reveal">
        <div class="ref-header">
            <div class="ref-title">Referral Link</div>
            <div class="ref-stats" id="invites-text">0/4 referrals</div>
        </div>
        <div class="item-sub" style="margin-bottom: 10px;">Invite up to four members to unlock free section</div>
        <div class="ref-link-container">
            <div class="ref-url" id="ref-link">...</div>
            <button class="copy-btn" onclick="copyRef()">COPY</button>
        </div>
    </div>

    <div id="toast" class="toast">Link Copied!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Real-time user data
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        const username = data.username || "User";
                        document.getElementById('user-username').innerText = username;
                        document.getElementById('user-email').innerText = user.email;
                        document.getElementById('user-balance').innerText = `NGN ${Number(data.balance || 0).toLocaleString()}`;
                        document.getElementById('invites-text').innerText = `${data.invites || 0}/4 referrals`;
                        
                        // Referral logic using Username instead of UID
                        const baseUrl = window.location.origin;
                        document.getElementById('ref-link').innerText = `${baseUrl}/register.html?ref=${username}`;
                    }
                });

                // Fetch Order Count
                const q = query(collection(db, "orders"), where("userId", "==", user.uid));
                const orderSnap = await getDocs(q);
                document.getElementById('order-count').innerText = `${orderSnap.size} orders total`;

                // Animations
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            } else {
                window.location.href = 'index.html';
            }
        });

        window.copyRef = () => {
            const link = document.getElementById('ref-link').innerText;
            navigator.clipboard.writeText(link);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        };

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        };
    </script>
</body>
</html>
