<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Profile</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --dark-bg: #0a0a0c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* --- REVEAL ANIMATION --- */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 1.5rem;
        }

        /* --- PROFILE CARD --- */
        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .username { font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; word-break: break-all; }
        .user-email-display { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .user-id { font-size: 0.75rem; color: #666; letter-spacing: 1px; }

        /* --- STATS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-val { display: block; font-size: 1.1rem; font-weight: bold; color: var(--neon-cyan); }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        /* --- REFERRAL SECTION --- */
        .referral-card {
            background: rgba(188, 19, 254, 0.05);
            border: 1px solid rgba(188, 19, 254, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
        .ref-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ref-title { font-size: 0.85rem; font-weight: bold; color: var(--neon-purple); text-transform: uppercase; }
        .ref-count { font-size: 0.9rem; color: white; }
        
        .progress-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: var(--neon-purple); height: 100%; width: 0%; transition: 1s ease; }
        
        .ref-link-box {
            display: flex;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .ref-url { font-size: 0.75rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
        .copy-small { background: var(--neon-cyan); color: #000; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

        /* --- STATUS MESSAGE --- */
        #status-msg { text-align: center; font-size: 0.8rem; margin-bottom: 10px; min-height: 1.2rem; }
        .error { color: #ff4d4d; }
        .info { color: var(--neon-cyan); }

        /* --- SETTINGS LIST --- */
        .settings-group { margin-top: 30px; }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            background: var(--glass-bg);
            border-radius: 15px;
            margin-bottom: 10px;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .settings-item:active { border-color: var(--neon-cyan); background: rgba(0, 243, 255, 0.05); }
        .item-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
        .item-info p { font-size: 0.75rem; color: #aaa; }
        .action-text { font-size: 0.75rem; font-weight: bold; color: var(--neon-cyan); text-transform: uppercase; }

        .logout-btn {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.2);
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <header class="reveal">
        <a href="shop.html" class="back-btn">←</a>
        <h2 style="font-size: 1.2rem; letter-spacing: 1px;">MY PROFILE</h2>
    </header>

    <div id="status-msg"></div>

    <div class="profile-card reveal">
        <div class="avatar" id="avatar-initial">?</div>
        <div class="username" id="display-name">Loading...</div>
        <div class="user-email-display" id="user-email-header">...</div>
        <div class="user-id">UID: <span id="uid-display">-------</span></div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-val" id="total-purchases">0</span>
                <span class="stat-label">Orders</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="total-spent">₦0</span>
                <span class="stat-label">Spent</span>
            </div>
        </div>

        <div class="referral-card">
            <div class="ref-header">
                <span class="ref-title">Free Zone Goal</span>
                <span class="ref-count" id="ref-count-display">0/4 Invites</span>
            </div>
            <div class="progress-bg"><div class="progress-fill" id="ref-progress-bar"></div></div>
            <div class="ref-link-box">
                <span class="ref-url" id="ref-link-text">Generating link...</span>
                <button class="copy-small" onclick="copyRefLink()">COPY</button>
            </div>
        </div>
    </div>

    <div class="settings-group">
        <div class="reveal">
            <a href="fund.html" class="settings-item">
                <div class="item-info">
                    <h4>Wallet Balance</h4>
                    <p id="current-balance">₦0.00</p>
                </div>
                <span class="action-text">Add Funds ›</span>
            </a>
        </div>

        <div class="reveal">
            <a href="mine.html" class="settings-item">
                <div class="item-info">
                    <h4>Purchase History</h4>
                    <p>Access your digital assets & logs</p>
                </div>
                <span class="action-text">View Assets ›</span>
            </a>
        </div>
    </div>

    <button class="logout-btn reveal" onclick="logoutUser()">Log Out Account</button>

    <script>
        // Trigger reveal animations
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 100);
        });

        // Simulating the referral generation mechanism requested 
        function displayReferralData(uid) {
            const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            const refLink = `${baseUrl}/login.html?ref=${uid}`;
            document.getElementById('ref-link-text').innerText = refLink;
        }

        function copyRefLink() {
            const linkText = document.getElementById('ref-link-text').innerText;
            if(linkText && linkText !== "Generating link...") {
                navigator.clipboard.writeText(linkText).then(() => {
                    const status = document.getElementById('status-msg');
                    status.innerHTML = "<span class='info'>Referral link copied to clipboard!</span>";
                    setTimeout(() => status.innerHTML = "", 3000);
                });
            }
        }

        function logoutUser() {
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
