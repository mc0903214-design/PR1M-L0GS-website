<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Marketplace</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --dark-bg: #0a0a0c;
            --error-red: #ff4d4d;
            --skeletal: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--dark-bg);
            color: white;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            min-height: 100vh;
            padding: 15px;
        }

        /* --- SLOW REVEAL --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        header { 
            padding: 10px 5px 25px 5px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .back-link { color: var(--neon-cyan); text-decoration: none; font-size: 1.5rem; }
        .cat-title { font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase; }

        /* --- SKELETAL LOADING --- */
        .skeleton {
            background: var(--skeletal);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .sk-img { height: 180px; width: 100%; background: rgba(255,255,255,0.03); }
        .sk-body { padding: 20px; }
        .sk-line { height: 15px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border-radius: 4px; }
        .sk-line.short { width: 60%; }
        .sk-line.btn { height: 40px; width: 100px; float: right; border-radius: 10px; }

        /* --- PRODUCT CARD --- */
        .product-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .preview-img {
            width: 100%;
            height: 180px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .preview-img img, .preview-img video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .stock-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        .stock-low { color: var(--error-red); border-color: var(--error-red); }
        .stock-ok { color: #00ff88; }
        .stock-single { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        .stock-out { color: #888; border-color: #444; }

        .product-body { padding: 20px; }
        .prod-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--neon-cyan); }

        .purchase-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .price { font-size: 1.3rem; font-weight: 800; color: white; }
        .price span { font-size: 0.8rem; color: #888; font-weight: normal; margin-right: 2px; }
        .free-price { color: #00ff88; letter-spacing: 1px; }

        .buy-btn {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .buy-btn.disabled {
            background: #333;
            pointer-events: none;
            color: #666;
        }

        .buy-btn:active { transform: scale(0.95); opacity: 0.8; }
        #status-msg { text-align: center; color: var(--error-red); font-size: 0.9rem; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="reveal active">
        <a href="shop.html" class="back-link">←</a>
        <h1 class="cat-title" id="cat-display">Marketplace</h1>
    </header>

    <div id="status-msg"></div>

    <div id="product-list">
        <div class="skeleton">
            <div class="sk-img"></div>
            <div class="sk-body">
                <div class="sk-line"></div>
                <div class="sk-line short"></div>
                <div class="sk-line btn"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusDiv = document.getElementById('status-msg');
        const params = new URLSearchParams(window.location.search);
        const category = params.get('cat') || "Logs"; 
        document.getElementById('cat-display').innerText = category;

        async function loadProducts(user) {
            const list = document.getElementById('product-list');
            
            try {
                const q = query(collection(db, "products"), where("category", "==", category));
                const querySnapshot = await getDocs(q);
                
                list.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    list.innerHTML = `<p style="text-align:center; color:#555; margin-top:50px;">No digital assets found in "${category}".</p>`;
                    return;
                }

                if(user) {
                    addDoc(collection(db, "logs"), {
                        type: "CATEGORY_BROWSE",
                        details: `${user.email} opened ${category} catalog`,
                        timestamp: serverTimestamp()
                    });
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let stockClass = 'stock-ok';
                    let stockText = 'AVAILABLE';
                    let btnDisabled = "";

                    // Determine Pricing HTML
                    let priceDisplay = `<div class="price"><span>₦</span>${data.price.toLocaleString()}</div>`;
                    if (data.price <= 0) {
                        priceDisplay = `<div class="price free-price">FREE</div>`;
                    }

                    if (data.mode === "SINGLE") {
                        stockClass = 'stock-single';
                        stockText = 'READY';
                    } else {
                        const count = data.stockCount || 0;
                        if (count <= 0) {
                            stockClass = 'stock-out';
                            stockText = 'OUT OF STOCK';
                            btnDisabled = "disabled";
                        } else if (count < 5) {
                            stockClass = 'stock-low';
                            stockText = `${count} ITEMS LEFT`;
                        } else {
                            stockText = `${count} IN STOCK`;
                        }
                    }

                    // Handle Media Type (Video vs Image)
                    const mediaUrl = data.image || 'https://via.placeholder.com/400x180/1a1a2e/00f3ff?text=PR1MΞ+ASSET';
                    const isVideo = /\.(mp4|webm|mov|ogg)$/i.test(mediaUrl);
                    let mediaHtml = isVideo 
                        ? `<video src="${mediaUrl}" autoplay loop muted playsinline></video>`
                        : `<img src="${mediaUrl}" alt="Preview">`;

                    const card = document.createElement('div');
                    card.className = 'product-card reveal';
                    card.innerHTML = `
                        <div class="preview-img">
                            ${mediaHtml}
                            <div class="stock-badge ${stockClass}">${stockText}</div>
                        </div>
                        <div class="product-body">
                            <div class="prod-name">${data.name}</div>
                            <div class="purchase-row">
                                ${priceDisplay}
                                <a href="buy.html?id=${doc.id}&name=${encodeURIComponent(data.name)}&price=${data.price}" 
                                   class="buy-btn ${btnDisabled}">
                                   ${btnDisabled ? 'Sold Out' : 'VIEW'}
                                </a>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                    
                    setTimeout(() => card.classList.add('active'), 100);
                });
            } catch (error) {
                list.innerHTML = '';
                statusDiv.innerText = "Connection lost: " + error.message;
            }
        }

        onAuthStateChanged(auth, (user) => {
            loadProducts(user);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
