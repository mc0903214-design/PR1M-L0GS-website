<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PR1MΞ Gift Store</title>

<style>

:root {
    --neon-cyan: #00f3ff;
    --neon-purple: #bc13fe;
    --dark-bg: #060608;
    --glass-bg: rgba(255,255,255,.035);
    --glass-border: rgba(255,255,255,.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(188,19,254,.08) 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,243,255,.06) 0%,
            transparent 35%
        ),
        #060608;

    color: #f1f1f3;
    min-height: 100vh;

    padding: 20px 14px 50px;

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeSpeed;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

.hidden {
    display: none !important;
}


/* =========================================================
   LOADER
========================================================= */

.spinner {
    width: 25px;
    height: 25px;

    border: 2.5px solid rgba(255,255,255,.14);
    border-top-color: var(--neon-cyan);

    border-radius: 50%;

    animation: spin .8s linear infinite;

    display: inline-block;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   HEADER
========================================================= */

header {

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 4px 5px 20px;
}

.logo {

    font-size: 1.35rem;
    font-weight: 800;

    letter-spacing: 2.5px;

    color: #fff;

    text-shadow:
        0 0 10px rgba(0,243,255,.4);
}

.back-btn {

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: rgba(255,255,255,.045);

    border: 1px solid var(--glass-border);

    color: #fff;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.back-btn:hover {

    background: rgba(255,255,255,.08);

}

.back-btn:active {

    transform: scale(.95);

}


/* =========================================================
   HERO
========================================================= */

.hero {

    position: relative;

    padding: 28px 22px;

    margin-bottom: 22px;

    border-radius: 24px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(188,19,254,.18),
            rgba(0,243,255,.08)
        );

    border: 1px solid rgba(188,19,254,.18);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.hero::after {

    content: '';

    position: absolute;

    width: 170px;
    height: 170px;

    right: -70px;
    top: -70px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,243,255,.16),
            transparent 70%
        );

    pointer-events: none;
}

.hero-content {

    position: relative;

    z-index: 1;
}

.hero-title {

    font-size: 1.75rem;

    font-weight: 800;

    margin-bottom: 8px;

    color: #fff;
}

.hero-title span {

    color: var(--neon-cyan);

    text-shadow:
        0 0 10px rgba(0,243,255,.3);
}

.hero-description {

    color: #aeb8c7;

    font-size: .9rem;

    line-height: 1.6;

    max-width: 500px;
}


/* =========================================================
   BALANCE
========================================================= */

.balance-card {

    background:
        linear-gradient(
            135deg,
            rgba(30,60,114,.40),
            rgba(42,82,152,.18)
        );

    border:
        1px solid rgba(58,118,240,.25);

    border-radius: 22px;

    padding: 20px;

    margin-bottom: 24px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.balance-left {

    min-width: 0;
}

.balance-label {

    color: #8e9aaa;

    font-size: .7rem;

    text-transform: uppercase;

    letter-spacing: 1.3px;

    font-weight: 600;

    margin-bottom: 5px;
}

.balance-value {

    font-size: 1.45rem;

    font-weight: 750;

    color: #fff;

    min-height: 30px;

    display: flex;

    align-items: center;
}

.topup-btn {

    flex-shrink: 0;

    text-decoration: none;

    color: #060608;

    background: #fff;

    padding: 10px 14px;

    border-radius: 12px;

    font-size: .75rem;

    font-weight: 750;

    border: none;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.topup-btn:active {

    transform: scale(.96);

}

.topup-btn:hover {

    opacity: .9;

}


/* =========================================================
   SECTION
========================================================= */

.section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;

    padding: 0 3px;
}

.section-title {

    font-size: .78rem;

    color: #718096;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 2px;
}


/* =========================================================
   GIFT GRID
========================================================= */

.gift-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 13px;

    margin-bottom: 40px;
}


/* =========================================================
   GIFT CARD
========================================================= */

.gift-card {

    background: rgba(255,255,255,.028);

    border:
        1px solid var(--glass-border);

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    min-width: 0;

    contain: content;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}

.gift-card:hover {

    background: rgba(255,255,255,.045);

    border-color:
        rgba(255,255,255,.13);

}

.gift-card:active {

    transform: scale(.985);

}


/* =========================================================
   IMAGE SWIPE AREA
========================================================= */

.gift-image-container {

    width: 100%;

    aspect-ratio: 1 / 1;

    background:
        rgba(255,255,255,.025);

    overflow: hidden;

    position: relative;
}

.gift-image-track {

    width: 100%;
    height: 100%;

    display: flex;

    transform: translateX(0);

    transition:
        transform .65s cubic-bezier(.22,.61,.36,1);

    will-change: transform;
}

.gift-image-slide {

    width: 100%;
    height: 100%;

    flex: 0 0 100%;

    min-width: 100%;

    object-fit: cover;

    display: block;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   IMAGE FALLBACK
========================================================= */

.gift-image-fallback {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(188,19,254,.12),
            rgba(0,243,255,.08)
        );

    color: #718096;
}

.gift-image-fallback svg {

    width: 35px;
    height: 35px;

    opacity: .55;
}


/* =========================================================
   SWIPE INDICATORS
========================================================= */

.gift-image-dots {

    position: absolute;

    left: 50%;
    bottom: 9px;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 5px;

    padding: 5px 7px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.35);

    backdrop-filter: blur(5px);

    -webkit-backdrop-filter: blur(5px);

    pointer-events: none;
}

.gift-image-dot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.45);

    transition:
        width .25s ease,
        background .25s ease;
}

.gift-image-dot.active {

    width: 14px;

    border-radius: 5px;

    background:
        var(--neon-cyan);

    box-shadow:
        0 0 7px rgba(0,243,255,.55);
}


/* =========================================================
   CARD CONTENT
========================================================= */

.gift-content {

    padding: 13px;

    display: flex;

    flex-direction: column;

    flex: 1;

    min-width: 0;
}

.gift-name {

    color: #fff;

    font-size: .88rem;

    font-weight: 700;

    line-height: 1.35;

    margin-bottom: 7px;

    overflow-wrap: anywhere;

    word-break: break-word;
}

.gift-description {

    color: #8792a3;

    font-size: .72rem;

    line-height: 1.55;

    margin-bottom: 14px;

    overflow-wrap: anywhere;

    word-break: break-word;

    flex: 1;
}


/* =========================================================
   CARD BOTTOM
   PRICE ABOVE BUTTON
========================================================= */

.gift-bottom {

    display: flex;

    flex-direction: column;

    align-items: stretch;

    justify-content: flex-start;

    gap: 9px;

    margin-top: auto;

    width: 100%;

    min-width: 0;
}

.gift-price {

    color: var(--neon-cyan);

    font-size: .92rem;

    font-weight: 800;

    line-height: 1.3;

    width: 100%;

    min-width: 0;

    white-space: normal;

    overflow-wrap: anywhere;

    word-break: break-word;
}

.send-gift-btn {

    border: none;

    border-radius: 10px;

    padding: 9px 10px;

    background:
        linear-gradient(
            90deg,
            var(--neon-purple),
            #9d4edd
        );

    color: #fff;

    font-size: .63rem;

    font-weight: 800;

    cursor: pointer;

    width: 100%;

    max-width: 100%;

    min-width: 0;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    display: block;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.send-gift-btn:hover {

    opacity: .92;

}

.send-gift-btn:active {

    transform: scale(.97);

}


/* =========================================================
   LOADING
========================================================= */

.loading-state {

    grid-column: 1 / -1;

    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 170px;

    border:
        1px dashed rgba(255,255,255,.08);

    border-radius: 18px;
}

.loading-inner {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.loading-text {

    color: #718096;

    font-size: .78rem;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state {

    grid-column: 1 / -1;

    padding: 45px 20px;

    text-align: center;

    border:
        1px dashed var(--glass-border);

    border-radius: 18px;

    color: #718096;
}

.empty-icon {

    width: 55px;
    height: 55px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: 0 auto 14px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.07);
}

.empty-icon svg {

    width: 26px;
    height: 26px;

    opacity: .6;
}

.empty-title {

    color: #cbd5e0;

    font-size: .9rem;

    font-weight: 700;

    margin-bottom: 5px;
}

.empty-message {

    font-size: .75rem;

    color: #667386;
}


/* =========================================================
   ERROR
========================================================= */

.error-state {

    grid-column: 1 / -1;

    padding: 35px 20px;

    text-align: center;

    border:
        1px dashed rgba(255,75,75,.18);

    border-radius: 18px;

    color: #9b6b6b;
}

.retry-btn {

    margin-top: 13px;

    padding: 9px 15px;

    border-radius: 10px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    color: #fff;

    font-size: .75rem;

    font-weight: 700;

    cursor: pointer;
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translate(-50%, 100px);

    width: calc(100% - 30px);

    max-width: 380px;

    padding: 13px 16px;

    border-radius: 14px;

    background:
        rgba(10,10,14,.97);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 8px 30px rgba(0,0,0,.4);

    color: #fff;

    font-size: .78rem;

    text-align: center;

    z-index: 9999;

    opacity: 0;

    transition:
        transform .22s ease,
        opacity .22s ease;
}

.toast.show {

    transform:
        translate(-50%, 0);

    opacity: 1;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 520px) {

    body {
        padding:
            16px 11px 40px;
    }

    .hero {
        padding: 24px 19px;
    }

    .hero-title {
        font-size: 1.5rem;
    }

    .balance-card {
        padding: 17px;
    }

    .gift-grid {
        gap: 10px;
    }

    .gift-content {
        padding: 11px;
    }

    .gift-name {
        font-size: .82rem;
    }

    .gift-description {
        font-size: .68rem;
        line-height: 1.5;
    }

    .gift-bottom {
        gap: 8px;
    }

    .gift-price {
        font-size: .78rem;
    }

    .send-gift-btn {
        width: 100%;

        padding:
            8px 7px;

        font-size: .57rem;
    }

}

@media (max-width: 360px) {

    .gift-grid {
        grid-template-columns: 1fr;
    }

    .gift-name {
        font-size: .88rem;
    }

    .gift-description {
        font-size: .73rem;
    }

    .gift-price {
        font-size: .88rem;
    }

    .send-gift-btn {
        width: 100%;

        font-size: .64rem;

        padding:
            9px 10px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;

        scroll-behavior: auto !important;
    }

}

</style>
</head>

        <svg

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",

    authDomain:
        "primelogs-web.firebaseapp.com",

    projectId:
        "primelogs-web",

    storageBucket:
        "primelogs-web.firebasestorage.app",

    messagingSenderId:
        "732956069251",

    appId:
        "1:732956069251:web:b9c8be37e6db4f98db3ab6"

};



/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =========================================================
   DOM CACHE
========================================================= */

const giftGrid =
    document.getElementById(
        'giftGrid'
    );

const balanceLoader =
    document.getElementById(
        'balanceLoader'
    );

const balanceText =
    document.getElementById(
        'balanceText'
    );

const balanceDisplay =
    document.getElementById(
        'balance'
    );

const backButton =
    document.getElementById(
        'backButton'
    );

const toast =
    document.getElementById(
        'toast'
    );



/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let allGifts = [];

let balanceUnsubscribe = null;



/* =========================================================
   BACK BUTTON
========================================================= */

/*
 * Always return directly to shop.html.
 */

backButton.addEventListener(
    'click',
    () => {

        window.location.href =
            'shop.html';

    }
);



/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message) {

    clearTimeout(toastTimer);

    toast.textContent =
        message;

    toast.classList.add(
        'show'
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    'show'
                );

            },
            3000
        );

}



/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(value) {

    const number =
        Number(value || 0);

    return number.toLocaleString(
        undefined,
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}



/* =========================================================
   CREATE IMAGE FALLBACK
========================================================= */

function createImageFallback() {

    const fallback =
        document.createElement(
            'div'
        );

    fallback.className =
        'gift-image-fallback';

    fallback.innerHTML = `

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
        >

            <rect
                x="3"
                y="8"
                width="18"
                height="13"
                rx="2"
            />

            <path d="M12 8v13"/>

            <path d="M3 12h18"/>

            <path d="M12 8H8.5a2.5 2.5 0 1 1 0-5C10.5 3 12 8 12 8Z"/>

            <path d="M12 8h3.5a2.5 2.5 0 1 0 0-5C13.5 3 12 8 12 8Z"/>

        </svg>

    `;

    return fallback;

}



/* =========================================================
   CREATE GIFT CARD
========================================================= */

function createGiftCard(
    gift,
    index
) {

    const card =
        document.createElement(
            'div'
        );

    card.className =
        'gift-card';



    /* =====================================================
       IMAGE CONTAINER
    ===================================================== */

    const imageContainer =
        document.createElement(
            'div'
        );

    imageContainer.className =
        'gift-image-container';



    /*
     * Support:
     *
     * imageUrls: [...]
     *
     * and:
     *
     * imageUrl: "..."
     */

    let imageUrls = [];


    if (
        Array.isArray(
            gift.imageUrls
        )
    ) {

        imageUrls =
            gift.imageUrls.filter(
                url =>
                    typeof url === 'string' &&
                    url.trim()
            );

    }


    if (
        !imageUrls.length &&
        typeof gift.imageUrl === 'string' &&
        gift.imageUrl.trim()
    ) {

        imageUrls = [
            gift.imageUrl.trim()
        ];

    }



    /* =====================================================
       NO IMAGE
    ===================================================== */

    if (
        !imageUrls.length
    ) {

        imageContainer.appendChild(
            createImageFallback()
        );

    } else {

        /*
         * Create horizontal image track.
         */

        const track =
            document.createElement(
                'div'
            );

        track.className =
            'gift-image-track';



        /*
         * Add every image as a
         * separate horizontal slide.
         */

        imageUrls.forEach(
            (url, imageIndex) => {

                const image =
                    document.createElement(
                        'img'
                    );

                image.className =
                    'gift-image-slide';

                image.alt =
                    gift.name ||
                    'Gift';

                image.loading =
                    index < 4
                        ? 'eager'
                        : 'lazy';

                image.decoding =
                    'async';

                image.src =
                    url;


                image.addEventListener(
                    'error',
                    () => {

                        image.replaceWith(
                            createImageFallback()
                        );

                    },
                    {
                        once: true
                    }
                );


                track.appendChild(
                    image
                );

            }
        );


        imageContainer.appendChild(
            track
        );



        /* =================================================
           AUTOMATIC SWIPE
        ================================================= */

        if (
            imageUrls.length > 1
        ) {

            /*
             * Create dots so the user can
             * see that the card contains
             * multiple images.
             */

            const dots =
                document.createElement(
                    'div'
                );

            dots.className =
                'gift-image-dots';


            const dotElements = [];


            imageUrls.forEach(
                (
                    _,
                    dotIndex
                ) => {

                    const dot =
                        document.createElement(
                            'span'
                        );

                    dot.className =
                        'gift-image-dot';


                    if (
                        dotIndex === 0
                    ) {

                        dot.classList.add(
                            'active'
                        );

                    }


                    dots.appendChild(
                        dot
                    );

                    dotElements.push(
                        dot
                    );

                }
            );


            imageContainer.appendChild(
                dots
            );



            let imageIndex = 0;

            let interval = null;


            const moveToNextImage =
                () => {

                    if (
                        !document.body.contains(
                            card
                        )
                    ) {

                        if (interval) {

                            clearInterval(
                                interval
                            );

                        }

                        return;

                    }


                    imageIndex =
                        (
                            imageIndex + 1
                        ) %
                        imageUrls.length;


                    /*
                     * Move the entire track
                     * horizontally.
                     */

                    track.style.transform =
                        `translateX(-${
                            imageIndex * 100
                        }%)`;


                    /*
                     * Update dots.
                     */

                    dotElements.forEach(
                        (
                            dot,
                            dotIndex
                        ) => {

                            dot.classList.toggle(
                                'active',
                                dotIndex === imageIndex
                            );

                        }
                    );

                };


            /*
             * Swipe to the next image
             * every 4 seconds.
             */

            interval =
                setInterval(
                    moveToNextImage,
                    4000
                );


            /*
             * Pause automatic swipe
             * when the user touches.
             */

            imageContainer.addEventListener(
                'touchstart',
                () => {

                    if (interval) {

                        clearInterval(
                            interval
                        );

                        interval =
                            null;

                    }

                },
                {
                    passive: true
                }
            );


            /*
             * Restart automatic swiping
             * after touch ends.
             */

            imageContainer.addEventListener(
                'touchend',
                () => {

                    if (
                        !document.body.contains(
                            card
                        )
                    ) {

                        return;

                    }


                    if (!interval) {

                        interval =
                            setInterval(
                                moveToNextImage,
                                4000
                            );

                    }

                },
                {
                    passive: true
                }
            );

        }

    }



    /* =====================================================
       CARD CONTENT
    ===================================================== */

    const content =
        document.createElement(
            'div'
        );

    content.className =
        'gift-content';



    /* =====================================================
       NAME
    ===================================================== */

    const name =
        document.createElement(
            'div'
        );

    name.className =
        'gift-name';

    name.textContent =
        gift.name ||
        'Unnamed Gift';



    /* =====================================================
       DESCRIPTION
    ===================================================== */

    const description =
        document.createElement(
            'div'
        );

    description.className =
        'gift-description';

    description.textContent =
        gift.description ||
        'A special gift for someone special.';



    /* =====================================================
       BOTTOM
    ===================================================== */

    const bottom =
        document.createElement(
            'div'
        );

    bottom.className =
        'gift-bottom';



    /* =====================================================
       PRICE
    ===================================================== */

    const price =
        document.createElement(
            'div'
        );

    price.className =
        'gift-price';

    price.textContent =
        `₦${formatPrice(
            gift.price
        )}`;



    /* =====================================================
       SEND BUTTON
    ===================================================== */

    const sendButton =
        document.createElement(
            'button'
        );

    sendButton.type =
        'button';

    sendButton.className =
        'send-gift-btn';

    sendButton.textContent =
        'SEND THIS GIFT';


    sendButton.addEventListener(
        'click',
        event => {

            event.stopPropagation();


            /*
             * Logged-out users
             * must login first.
             */

            if (!currentUser) {

                window.location.href =
                    'login.html';

                return;

            }


            /*
             * Logged-in users go
             * directly to checkout.
             */

            window.location.href =
                `buygift.html?id=${encodeURIComponent(
                    gift.id
                )}`;

        }
    );



    /*
     * PRICE FIRST
     * BUTTON SECOND
     */

    bottom.appendChild(
        price
    );

    bottom.appendChild(
        sendButton
    );


    content.appendChild(
        name
    );

    content.appendChild(
        description
    );

    content.appendChild(
        bottom
    );


    card.appendChild(
        imageContainer
    );

    card.appendChild(
        content
    );


    return card;

}



/* =========================================================
   RENDER GIFTS
========================================================= */

function renderGifts(
    gifts
) {

    giftGrid.replaceChildren();


    if (
        !gifts.length
    ) {

        const empty =
            document.createElement(
                'div'
            );

        empty.className =
            'empty-state';

        empty.innerHTML = `

            <div class="empty-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                >

                    <rect
                        x="3"
                        y="8"
                        width="18"
                        height="13"
                        rx="2"
                    />

                    <path d="M12 8v13"/>

                    <path d="M3 12h18"/>

                    <path d="M12 8H8.5a2.5 2.5 0 1 1 0-5C10.5 3 12 8 12 8Z"/>

                    <path d="M12 8h3.5a2.5 2.5 0 1 0 0-5C13.5 3 12 8 12 8Z"/>

                </svg>

            </div>

            <div class="empty-title">
                No Gifts Available
            </div>

            <div class="empty-message">
                New gifts will appear here when they are available.
            </div>

        `;

        giftGrid.appendChild(
            empty
        );

        return;

    }



    /* =====================================================
       SORT NEWEST FIRST
    ===================================================== */

    gifts.sort(
        (a, b) => {

            const aTime =
                getTimestampMs(
                    a.createdAt
                );

            const bTime =
                getTimestampMs(
                    b.createdAt
                );

            return bTime - aTime;

        }
    );



    /* =====================================================
       BATCH RENDER
    ===================================================== */

    const BATCH_SIZE = 10;

    let currentIndex = 0;


    function renderBatch() {

        const fragment =
            document.createDocumentFragment();


        const end =
            Math.min(
                currentIndex +
                    BATCH_SIZE,
                gifts.length
            );


        for (
            let i = currentIndex;
            i < end;
            i++
        ) {

            fragment.appendChild(
                createGiftCard(
                    gifts[i],
                    i
                )
            );

        }


        giftGrid.appendChild(
            fragment
        );


        currentIndex =
            end;


        if (
            currentIndex <
            gifts.length
        ) {

            requestAnimationFrame(
                renderBatch
            );

        }

    }


    renderBatch();

}



/* =========================================================
   TIMESTAMP HELPER
========================================================= */

function getTimestampMs(
    value
) {

    if (!value) {
        return 0;
    }


    if (
        typeof value.toMillis ===
        'function'
    ) {

        return value.toMillis();

    }


    if (
        typeof value.toDate ===
        'function'
    ) {

        return value.toDate().getTime();

    }


    if (
        typeof value === 'number'
    ) {

        return value;

    }


    const date =
        new Date(value);


    return isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}



/* =========================================================
   LOAD GIFTS
========================================================= */

async function loadGifts() {

    giftGrid.innerHTML = `

        <div class="loading-state">

            <div class="loading-inner">

                <div class="spinner"></div>

                <div class="loading-text">
                    Loading gifts...
                </div>

            </div>

        </div>

    `;


    try {

        const giftsQuery =
            query(
                collection(
                    db,
                    'gifts'
                ),

                where(
                    'active',
                    '==',
                    true
                )
            );


        const snapshot =
            await getDocs(
                giftsQuery
            );


        const gifts = [];


        snapshot.forEach(
            giftDoc => {

                const data =
                    giftDoc.data();


                gifts.push({

                    id:
                        giftDoc.id,

                    ...data

                });

            }
        );


        allGifts =
            gifts;


        renderGifts(
            allGifts
        );


    } catch (error) {

        console.error(
            'Gift loading error:',
            error
        );


        giftGrid.innerHTML = `

            <div class="error-state">

                <div style="
                    color:#ff7a7a;
                    font-size:.9rem;
                    font-weight:700;
                    margin-bottom:6px;
                ">
                    Unable to load gifts
                </div>

                <div style="
                    font-size:.75rem;
                    line-height:1.5;
                ">
                    Please check your connection
                    and try again.
                </div>

                <button
                    class="retry-btn"
                    id="retryGiftButton"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        `;


        const retryButton =
            document.getElementById(
                'retryGiftButton'
            );


        if (retryButton) {

            retryButton.addEventListener(
                'click',
                loadGifts
            );

        }

    }

}



/* =========================================================
   BALANCE
========================================================= */

function startBalanceListener(
    user
) {

    if (
        balanceUnsubscribe
    ) {

        balanceUnsubscribe();

        balanceUnsubscribe =
            null;

    }


    balanceUnsubscribe =
        onSnapshot(
            doc(
                db,
                'users',
                user.uid
            ),

            snapshot => {

                if (
                    !snapshot.exists()
                ) {

                    balanceLoader.classList.add(
                        'hidden'
                    );

                    balanceText.classList.remove(
                        'hidden'
                    );

                    balanceDisplay.textContent =
                        '0.00';

                    return;

                }


                const data =
                    snapshot.data();


                const userBalance =
                    Number(
                        data.balance || 0
                    );


                balanceDisplay.textContent =
                    userBalance.toLocaleString(
                        undefined,
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    );


                balanceLoader.classList.add(
                    'hidden'
                );


                balanceText.classList.remove(
                    'hidden'
                );

            },

            error => {

                console.error(
                    'Balance listener error:',
                    error
                );


                balanceLoader.classList.add(
                    'hidden'
                );


                balanceText.classList.remove(
                    'hidden'
                );


                balanceDisplay.textContent =
                    '0.00';

            }
        );

}



/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        currentUser =
            user || null;


        if (user) {

            startBalanceListener(
                user
            );

        } else {

            if (
                balanceUnsubscribe
            ) {

                balanceUnsubscribe();

                balanceUnsubscribe =
                    null;

            }


            balanceLoader.classList.add(
                'hidden'
            );

            balanceText.classList.remove(
                'hidden'
            );

            balanceDisplay.textContent =
                '0.00';

        }

    }
);



/* =========================================================
   START GIFT LOADING
========================================================= */

loadGifts();



/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    'beforeunload',
    () => {

        if (
            balanceUnsubscribe
        ) {

            balanceUnsubscribe();

        }

    }
);

</script>
