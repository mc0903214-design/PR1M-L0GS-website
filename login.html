<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Access</title>
    <style>
        :root { --neon-cyan: #00f3ff; --neon-purple: #bc13fe; --glass: rgba(255, 255, 255, 0.05); }
        body { 
            background: #0a0a0c; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
        }
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 350px;
            position: relative;
        }

        /* --- BUTTON SPINNER --- */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { text-align: center; margin-bottom: 20px; color: var(--neon-cyan); letter-spacing: 2px; }
        
        .input-group { position: relative; margin: 10px 0; }
        
        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: var(--neon-cyan); }
        
        /* Professional Toggle Styling */
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--neon-cyan);
            user-select: none;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .eye-btn:hover { background: rgba(0, 243, 255, 0.1); }

        #status-msg {
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            min-height: 1.2rem;
        }
        .error { color: #ff4d4d; }
        .info { color: var(--neon-cyan); }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .toggle-text { text-align: center; font-size: 0.8rem; margin-top: 15px; color: #888; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="auth-title">LOGIN</h2>
        <div id="status-msg"></div>
        
        <input type="email" id="email" placeholder="Email Address">
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            <span class="eye-btn" id="eye-text" onclick="togglePass()">Show</span>
        </div>

        <div id="ref-group" class="hidden">
            <input type="text" id="referral" placeholder="Referral Code (Optional)">
        </div>
        
        <button class="submit-btn" id="auth-submit">
            <span id="btn-text">CONTINUE</span>
            <div id="btn-loader" class="spinner hidden"></div>
        </button>
        <p class="toggle-text" id="toggle-btn" onclick="toggleAuth()">Don't have an account? Signup</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, getDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusDiv = document.getElementById('status-msg');
        const btnLoader = document.getElementById('btn-loader');
        const btnText = document.getElementById('btn-text');

        // AUTO-FILL REFERRAL FROM URL
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const refCode = params.get('ref');
            if (refCode) {
                document.getElementById('referral').value = refCode;
                // If there's a ref code, we assume they want to signup
                if(document.getElementById('auth-title').innerText === 'LOGIN') toggleAuth();
            }
        };

        window.togglePass = function() {
            const passInput = document.getElementById('password');
            const eyeText = document.getElementById('eye-text');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeText.innerText = 'Hide';
            } else {
                passInput.type = 'password';
                eyeText.innerText = 'Show';
            }
        };

        window.toggleAuth = function() {
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('toggle-btn');
            const refGroup = document.getElementById('ref-group');
            
            statusDiv.innerText = ""; 
            
            if (title.innerText === 'LOGIN') {
                title.innerText = 'SIGNUP';
                btn.innerText = 'Already have an account? Login';
                refGroup.classList.remove('hidden');
            } else {
                title.innerText = 'LOGIN';
                btn.innerText = "Don't have an account? Signup";
                refGroup.classList.add('hidden');
            }
        };

        document.getElementById('auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('referral').value.trim();
            const isLogin = document.getElementById('auth-title').innerText === 'LOGIN';

            if(!email || !password) return setStatus("Please fill all fields.");

            btnLoader.classList.remove('hidden');
            btnText.innerText = "PROCESSING";
            statusDiv.innerText = "";

            try {
                await setPersistence(auth, browserLocalPersistence);

                if (isLogin) {
                    const res = await signInWithEmailAndPassword(auth, email, password);
                    const userSnap = await getDoc(doc(db, "users", res.user.uid));
                    if (userSnap.exists() && userSnap.data().status === 'banned') {
                        await auth.signOut();
                        throw new Error("suspended");
                    }
                    window.location.href = 'shop.html';
                } else {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    
                    // Create user profile
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        email: email,
                        balance: 0,
                        referralCount: 0,
                        referredBy: refCode || null,
                        status: 'active',
                        joinedAt: serverTimestamp()
                    });

                    // Update referrer's count if code exists
                    if (refCode) {
                        const refRef = doc(db, "users", refCode);
                        const refSnap = await getDoc(refRef);
                        if (refSnap.exists()) {
                            await updateDoc(refRef, { referralCount: increment(1) });
                        }
                    }

                    window.location.href = 'shop.html';
                }
            } catch (err) {
                btnLoader.classList.add('hidden');
                btnText.innerText = "CONTINUE";
                if(err.message === "suspended") setStatus("Account suspended.");
                else if(err.code === 'auth/email-already-in-use') setStatus("Email already exists.");
                else if(err.code === 'auth/invalid-credential') setStatus("Invalid email or password.");
                else setStatus("Error. Try again.");
            }
        });

        function setStatus(text) {
            statusDiv.innerText = text;
            statusDiv.className = "error";
        }
    </script>
</body>
</html>
