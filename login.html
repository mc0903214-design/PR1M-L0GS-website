<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Access</title>
    <style>
        :root { --neon-cyan: #00f3ff; --neon-purple: #bc13fe; --glass: rgba(255, 255, 255, 0.05); }
        body { 
            background: #0a0a0c; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
        }
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 350px;
            position: relative;
            contain: content;
        }

        /* --- BUTTON SPINNER --- */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            will-change: transform;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { text-align: center; margin-bottom: 20px; color: var(--neon-cyan); letter-spacing: 2px; }
        
        .input-group { position: relative; margin: 10px 0; }
        
        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: var(--neon-cyan); }
        
        /* Professional Toggle Styling */
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--neon-cyan);
            user-select: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .eye-btn:hover { opacity: 0.8; }

        #status-msg {
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            min-height: 1.2rem;
        }
        .error { color: #ff4d4d; }
        .info { color: var(--neon-cyan); }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .toggle-text { text-align: center; font-size: 0.8rem; margin-top: 15px; color: #888; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="auth-title">LOGIN</h2>
        <div id="status-msg"></div>
        
        <input type="email" id="email" placeholder="Email Address">
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            <span class="eye-btn" id="eye-text" onclick="togglePass()">👁️</span>
        </div>

        <div id="ref-group" class="hidden">
            <input type="text" id="referral" placeholder="Referral Code (Optional)">
        </div>
        
        <button class="submit-btn" id="auth-submit">
            <span id="btn-text">CONTINUE</span>
            <div id="btn-loader" class="spinner hidden"></div>
        </button>
        <p class="toggle-text" id="toggle-btn" onclick="toggleAuth()">Don't have an account? Signup</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, getDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cached DOM Elements
        const statusDiv = document.getElementById('status-msg');
        const btnLoader = document.getElementById('btn-loader');
        const btnText = document.getElementById('btn-text');
        const passInput = document.getElementById('password');
        const eyeText = document.getElementById('eye-text');
        const authTitle = document.getElementById('auth-title');
        const toggleBtn = document.getElementById('toggle-btn');
        const refGroup = document.getElementById('ref-group');
        const emailInput = document.getElementById('email');
        const referralInput = document.getElementById('referral');

        // Clean Friendly Error Parser
        function parseAuthError(error) {
            if (!navigator.onLine || error.code === 'auth/network-request-failed') {
                return "no internet connection";
            }
            switch (error.code) {
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                    return "invalid login details";
                case 'auth/user-not-found':
                    return "account not found";
                case 'auth/invalid-email':
                    return "invalid email format";
                case 'auth/email-already-in-use':
                    return "account already exists";
                case 'auth/weak-password':
                    return "password should be at least 6 characters";
                default:
                    return "something went wrong, try again";
            }
        }

        // AUTO-FILL REFERRAL FROM URL & SET TO SIGNUP
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const refCode = params.get('ref');
            if (refCode) {
                referralInput.value = refCode;
                if (authTitle.innerText === 'LOGIN') {
                    toggleAuth();
                }
            }
        });

        window.togglePass = function() {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeText.innerText = '🙈';
            } else {
                passInput.type = 'password';
                eyeText.innerText = '👁️';
            }
        };

        window.toggleAuth = function() {
            statusDiv.innerText = ""; 
            
            if (authTitle.innerText === 'LOGIN') {
                authTitle.innerText = 'SIGNUP';
                toggleBtn.innerText = 'Already have an account? Login';
                refGroup.classList.remove('hidden');
            } else {
                authTitle.innerText = 'LOGIN';
                toggleBtn.innerText = "Don't have an account? Signup";
                refGroup.classList.add('hidden');
            }
        };

        function setStatus(msg, isError = true) {
            statusDiv.className = isError ? "error" : "info";
            statusDiv.innerText = msg;
            btnLoader.classList.add('hidden');
            btnText.innerText = "CONTINUE";
        }

        document.getElementById('auth-submit').addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passInput.value;
            const refCode = referralInput.value.trim();
            const isLogin = authTitle.innerText === 'LOGIN';

            if(!email || !password) return setStatus("Please fill all fields.");

            btnLoader.classList.remove('hidden');
            btnText.innerText = "PROCESSING";
            statusDiv.innerText = "";

            try {
                await setPersistence(auth, browserLocalPersistence);

                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = "shop.html";
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, "users", user.uid), {
                        email: email,
                        balance: 0,
                        role: "user",
                        referredBy: refCode || null,
                        createdAt: serverTimestamp()
                    });

                    if (refCode) {
                        const refDocRef = doc(db, "users", refCode);
                        const refDoc = await getDoc(refDocRef);
                        if (refDoc.exists()) {
                            await updateDoc(refDocRef, {
                                invites: increment(1)
                            });
                        }
                    }
                    window.location.href = "shop.html";
                }
            } catch (error) {
                setStatus(parseAuthError(error));
            }
        });
    </script>
</body>
</html>
