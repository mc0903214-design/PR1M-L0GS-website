<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR1MΞ | Access</title>
    <style>
        :root { --neon-cyan: #00f3ff; --neon-purple: #bc13fe; --glass: rgba(255, 255, 255, 0.05); }
        body { 
            background: #0a0a0c; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
        }
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 350px;
            position: relative;
            overflow: hidden;
        }
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .loader-bar {
            width: 50%;
            height: 2px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulse 0.4s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.2; transform: scaleX(0.5); }
            100% { opacity: 1; transform: scaleX(1); }
        }

        h2 { text-align: center; margin-bottom: 20px; color: var(--neon-cyan); letter-spacing: 2px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: var(--neon-cyan); }
        
        #status-msg {
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            min-height: 1.2rem;
        }
        .error { color: #ff4d4d; }
        .info { color: var(--neon-cyan); }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .toggle-text { text-align: center; font-size: 0.8rem; margin-top: 15px; color: #888; cursor: pointer; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div id="loading-overlay"><div class="loader-bar"></div></div>
        
        <h2 id="auth-title">LOGIN</h2>
        <div id="status-msg"></div>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button class="submit-btn" id="auth-submit">CONTINUE</button>
        <p class="toggle-text" id="toggle-btn" onclick="toggleAuth()">Don't have an account? Signup</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusDiv = document.getElementById('status-msg');

        function setStatus(text, isError = true) {
            statusDiv.innerText = text;
            statusDiv.className = isError ? "error" : "info";
        }

        // Fix: Attach to window so HTML onclick finds it
        window.toggleAuth = function() {
            const overlay = document.getElementById('loading-overlay');
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('toggle-btn');
            
            statusDiv.innerText = ""; 
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                if (title.innerText === 'LOGIN') {
                    title.innerText = 'SIGNUP';
                    btn.innerText = 'Already have an account? Login';
                } else {
                    title.innerText = 'LOGIN';
                    btn.innerText = "Don't have an account? Signup";
                }
                overlay.style.display = 'none';
            }, 400);
        }

        document.getElementById('auth-submit').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const isLogin = document.getElementById('auth-title').innerText === 'LOGIN';
            const overlay = document.getElementById('loading-overlay');

            if(!email || !password) {
                setStatus("Please fill all fields.");
                return;
            }

            overlay.style.display = 'flex';
            statusDiv.innerText = "";

            try {
                // Ensure user stays logged in even after closing browser
                await setPersistence(auth, browserLocalPersistence);

                if (isLogin) {
                    const res = await signInWithEmailAndPassword(auth, email, password);
                    
                    const userSnap = await getDoc(doc(db, "users", res.user.uid));
                    if (userSnap.exists() && userSnap.data().status === 'banned') {
                        await auth.signOut();
                        overlay.style.display = 'none';
                        return setStatus("ACCESS DENIED: Account suspended.");
                    }

                    window.location.href = 'shop.html';
                } else {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    
                    // Create the user profile with ₦0 balance by default
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        email: email,
                        balance: 0,
                        totalSpent: 0,
                        status: 'active',
                        joinedAt: serverTimestamp()
                    });

                    await addDoc(collection(db, "logs"), {
                        type: "NEW_USER",
                        details: `${email} joined PR1MΞ.`,
                        timestamp: serverTimestamp()
                    });

                    window.location.href = 'shop.html';
                }
            } catch (err) {
                overlay.style.display = 'none';
                console.error(err);
                // Handle common Firebase errors gracefully
                if(err.code === 'auth/email-already-in-use') setStatus("Email already exists.");
                else if(err.code === 'auth/weak-password') setStatus("Password is too weak.");
                else if(err.code === 'auth/invalid-credential') setStatus("Invalid email or password.");
                else setStatus("System Error. Try again.");
            }
        });
    </script>
</body>
</html>
