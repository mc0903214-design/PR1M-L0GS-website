<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR1MΞ | Login</title>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #060608;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --error-red: #ff4b4b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: #f1f1f3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;

            background-image:
                radial-gradient(circle at 15% 15%, rgba(188, 19, 254, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0d0d16 0%, #060608 100%);

            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;

            padding: 32px 24px;

            border-radius: 24px;

            background: var(--glass-bg);

            border: 1px solid var(--glass-border);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #8a8f98;
            font-size: 0.9rem;
            margin-bottom: 26px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.82rem;
            color: #c5c8ce;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 50px;

            border-radius: 12px;
            border: 1px solid var(--glass-border);

            background: rgba(0, 0, 0, 0.25);

            color: white;
            font-size: 0.95rem;

            outline: none;

            transition: 0.25s ease;
        }

        input:focus {
            border-color: var(--neon-cyan);

            background: rgba(0, 0, 0, 0.4);

            box-shadow: 0 0 12px rgba(0, 243, 255, 0.08);
        }

        input::placeholder {
            color: #68707b;
        }

        .eye-container {
            position: absolute;
            right: 14px;
            top: 40px;

            width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            color: #7d8590;

            transition: 0.2s ease;
        }

        .eye-container:hover {
            color: var(--neon-cyan);
        }

        .eye-container svg {
            width: 100%;
            height: 100%;
        }

        #status-msg {
            min-height: 20px;
            margin-bottom: 14px;

            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .error {
            color: var(--error-red);
        }

        .success {
            color: var(--neon-cyan);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(90deg, #9d4edd 0%, var(--neon-purple) 100%);

            color: white;

            font-size: 0.95rem;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            transition: 0.2s ease;

            box-shadow: 0 4px 20px rgba(188, 19, 254, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .redirect-link {
            margin-top: 22px;

            text-align: center;
            font-size: 0.85rem;

            color: #8a8f98;
        }

        .redirect-link a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .redirect-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="auth-card">

        <h2>Welcome Back</h2>

        <div class="subtitle">
            Sign in to continue to your account
        </div>

        <div id="status-msg"></div>

        <div class="input-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            />
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            />

            <div class="eye-container" id="eye-toggle">

                <!-- OPEN EYE -->
                <svg id="eye-open" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">

                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

                    <circle cx="12" cy="12" r="3"></circle>
                </svg>

                <!-- CLOSED EYE -->
                <svg id="eye-closed" class="hidden"
                    viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">

                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>

                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>

                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>

            </div>
        </div>

        <button class="submit-btn" id="auth-submit">

            <span id="btn-text">Sign In</span>

            <div id="btn-loader" class="spinner hidden"></div>

        </button>

        <p class="redirect-link">
            Don’t have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
            authDomain: "primelogs-web.firebaseapp.com",
            projectId: "primelogs-web",
            storageBucket: "primelogs-web.firebasestorage.app",
            messagingSenderId: "732956069251",
            appId: "1:732956069251:web:b9c8be37e6db4f98db3ab6"
        };

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const statusDiv = document.getElementById("status-msg");

        const btnLoader = document.getElementById("btn-loader");

        const btnText = document.getElementById("btn-text");

        const submitBtn = document.getElementById("auth-submit");

        const passInput = document.getElementById("password");

        const emailInput = document.getElementById("email");

        const eyeToggle = document.getElementById("eye-toggle");

        const eyeOpenIcon = document.getElementById("eye-open");

        const eyeClosedIcon = document.getElementById("eye-closed");


        function showMessage(message, isError = true) {

            statusDiv.className = isError ? "error" : "success";

            statusDiv.innerText = message;

            btnLoader.classList.add("hidden");

            btnText.innerText = "Sign In";

            submitBtn.disabled = false;
        }


        function getErrorMessage(error) {

            if (
                !navigator.onLine ||
                error.code === "auth/network-request-failed"
            ) {
                return "No internet connection.";
            }

            switch (error.code) {

                case "auth/invalid-credential":
                case "auth/wrong-password":
                case "auth/user-not-found":
                    return "Incorrect email or password.";

                case "auth/invalid-email":
                    return "Please enter a valid email address.";

                case "auth/user-disabled":
                    return "This account has been disabled.";

                default:
                    return "Unable to sign in right now.";
            }
        }


        eyeToggle.addEventListener("click", () => {

            if (passInput.type === "password") {

                passInput.type = "text";

                eyeOpenIcon.classList.add("hidden");

                eyeClosedIcon.classList.remove("hidden");

            } else {

                passInput.type = "password";

                eyeClosedIcon.classList.add("hidden");

                eyeOpenIcon.classList.remove("hidden");
            }
        });


        submitBtn.addEventListener("click", async () => {

            const email = emailInput.value.trim();

            const password = passInput.value;


            if (!email || !password) {
                return showMessage("Please fill in all fields.");
            }


            submitBtn.disabled = true;

            btnLoader.classList.remove("hidden");

            btnText.innerText = "Signing In...";

            statusDiv.innerText = "";


            try {

                await setPersistence(auth, browserLocalPersistence);

                await signInWithEmailAndPassword(auth, email, password);

                showMessage("Login successful!", false);

                setTimeout(() => {
                    window.location.href = "shop.html";
                }, 800);

            } catch (error) {

                showMessage(getErrorMessage(error));
            }

        });

    </script>

</body>
</html>
