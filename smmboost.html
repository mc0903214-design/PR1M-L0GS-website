<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Boost - PR1MΞ Market</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255,255,255,.035);
            --glass-border: rgba(255,255,255,.08);
            --dark-bg: #060608;
            --stock-green: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 10% 20%, rgba(188,19,254,.08) 0%, transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(0,243,255,.06) 0%, transparent 35%),
                #060608;
            color: #f1f1f3;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .hidden { display: none !important; }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 4px 8px 16px;
        }

        .back-btn {
            background: rgba(255,255,255,.04);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .smm-card {
            background: rgba(255,255,255,.025);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 700;
            color: #a0aec0;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(0,0,0,.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            outline: none;
            font-size: .9rem;
        }

        .form-control:focus {
            border-color: var(--neon-cyan);
        }

        .price-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,243,255,.05);
            border: 1px solid rgba(0,243,255,.2);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .price-amount {
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), #00a8ff);
            color: #060608;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: .95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-btn {
            width: 100%;
            background: rgba(255,255,255,.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,.2);
            border-top-color: #060608;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <button class="back-btn" onclick="history.back()" aria-label="Go Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    <div class="page-title">SMM Social Boost</div>
</header>

<div class="smm-card">
    <form id="smm-form">
        <div class="form-group">
            <label class="form-label" for="category-select">Category</label>
            <select id="category-select" class="form-control">
                <option value="">Loading categories...</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="service-select">Service</label>
            <select id="service-select" class="form-control" disabled>
                <option value="">Select a category first</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="link-input">Target Link</label>
            <input type="url" id="link-input" class="form-control" placeholder="https://instagram.com/username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="quantity-input">Quantity</label>
            <input type="number" id="quantity-input" class="form-control" placeholder="Min: 100" required disabled>
            <div id="quantity-hint" style="font-size: .75rem; color: #718096; margin-top: 4px;"></div>
        </div>

        <div class="price-badge">
            <span style="font-size: .85rem; color: #a0aec0;">Total Charge:</span>
            <span class="price-amount" id="total-price">₦0.00</span>
        </div>

        <button type="submit" id="submit-order" class="submit-btn" disabled>Submit Order</button>
    </form>
</div>

<a href="smmhistory.html" class="history-btn">View Order History</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
        authDomain: "primelogs-web.firebaseapp.com",
        projectId: "primelogs-web",
        storageBucket: "primelogs-web.firebasestorage.app",
        messagingSenderId: "732956069251",
        appId: "1:732956069251:web:b9c8be37e6db4f98db3ab3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const API_URL = "https://smm-proxy-backend.up.railway.app/api/smm"; // Replace with your backend URL
    const MARGIN_MULTIPLIER = 1.30; // 30% profit markup
    const NGN_RATE = 1500; // Exchange rate (USD to NGN)

    let currentUser = null;
    let rawServices = [];
    let selectedService = null;

    const categorySelect = document.getElementById('category-select');
    const serviceSelect = document.getElementById('service-select');
    const quantityInput = document.getElementById('quantity-input');
    const totalPriceDisplay = document.getElementById('total-price');
    const submitBtn = document.getElementById('submit-order');
    const smmForm = document.getElementById('smm-form');

    onAuthStateChanged(auth, user => {
        if (!user) { window.location.href = "index.html"; return; }
        currentUser = user;
        loadServices();
    });

    async function loadServices() {
        try {
            const res = await fetch(`${API_URL}/services`);
            rawServices = await res.json();
            
            const categories = [...new Set(rawServices.map(s => s.category))];
            categorySelect.innerHTML = '<option value="">Select Category</option>' + 
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
        } catch (err) {
            categorySelect.innerHTML = '<option value="">Error loading services</option>';
        }
    }

    categorySelect.addEventListener('change', () => {
        const cat = categorySelect.value;
        if (!cat) {
            serviceSelect.disabled = true;
            serviceSelect.innerHTML = '<option value="">Select a category first</option>';
            return;
        }

        const filtered = rawServices.filter(s => s.category === cat);
        serviceSelect.disabled = false;
        serviceSelect.innerHTML = '<option value="">Select Service</option>' + 
            filtered.map(s => `<option value="${s.service}">${s.name}</option>`).join('');
    });

    serviceSelect.addEventListener('change', () => {
        const serviceId = serviceSelect.value;
        selectedService = rawServices.find(s => String(s.service) === String(serviceId));
        
        if (selectedService) {
            quantityInput.disabled = false;
            quantityInput.min = selectedService.min;
            quantityInput.max = selectedService.max;
            document.getElementById('quantity-hint').textContent = `Min: ${selectedService.min} | Max: ${selectedService.max}`;
            calculatePrice();
        } else {
            quantityInput.disabled = true;
            submitBtn.disabled = true;
        }
    });

    quantityInput.addEventListener('input', calculatePrice);

    function calculatePrice() {
        if (!selectedService || !quantityInput.value) {
            totalPriceDisplay.textContent = '₦0.00';
            submitBtn.disabled = true;
            return;
        }

        const qty = parseInt(quantityInput.value) || 0;
        if (qty < parseInt(selectedService.min) || qty > parseInt(selectedService.max)) {
            submitBtn.disabled = true;
            return;
        }

        const ratePer1000USD = parseFloat(selectedService.rate);
        const costUSD = (ratePer1000USD / 1000) * qty;
        const totalNGN = costUSD * MARGIN_MULTIPLIER * NGN_RATE;

        totalPriceDisplay.textContent = `₦${totalNGN.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        submitBtn.disabled = false;
    }

    smmForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="spinner"></div>';

        const qty = parseInt(quantityInput.value);
        const link = document.getElementById('link-input').value.trim();

        try {
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);
            const userBalance = userSnap.data()?.balance || 0;

            const ratePer1000USD = parseFloat(selectedService.rate);
            const totalNGN = ((ratePer1000USD / 1000) * qty) * MARGIN_MULTIPLIER * NGN_RATE;

            if (userBalance < totalNGN) {
                alert("Insufficient wallet balance.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Order";
                return;
            }

            const apiRes = await fetch(`${API_URL}/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    service: selectedService.service,
                    link: link,
                    quantity: qty
                })
            });

            const orderResult = await apiRes.json();

            if (orderResult.order) {
                await updateDoc(userRef, { balance: increment(-totalNGN) });
                await addDoc(collection(db, "smm_orders"), {
                    userId: currentUser.uid,
                    smmOrderId: orderResult.order,
                    serviceName: selectedService.name,
                    link: link,
                    quantity: qty,
                    charge: totalNGN,
                    status: 'Pending',
                    createdAt: serverTimestamp()
                });

                alert("Order placed successfully!");
                window.location.href = "smmhistory.html";
            } else {
                alert("Order failed: " + (orderResult.error || "Provider error"));
            }
        } catch (err) {
            console.error(err);
            alert("Transaction failed. Try again.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Order";
        }
    });
</script>
</body>
</html>
