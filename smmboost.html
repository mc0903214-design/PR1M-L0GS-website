<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Boost - PR1MΞ Market</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255,255,255,.035);
            --glass-border: rgba(255,255,255,.08);
            --dark-bg: #060608;
            --stock-green: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 10% 20%, rgba(188,19,254,.08) 0%, transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(0,243,255,.06) 0%, transparent 35%),
                #060608;
            color: #f1f1f3;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .hidden { display: none !important; }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 4px 8px 16px;
        }

        .back-btn {
            background: rgba(255,255,255,.04);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .balance-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(188,19,254,.08);
            border: 1px solid rgba(188,19,254,.25);
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .balance-amount {
            color: var(--stock-green);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .smm-card {
            background: rgba(255,255,255,.025);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 700;
            color: #a0aec0;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(0,0,0,.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            outline: none;
            font-size: .9rem;
        }

        .form-control:focus {
            border-color: var(--neon-cyan);
        }

        .description-box {
            background: rgba(0,0,0,.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: .85rem;
            color: #cbd5e0;
            line-height: 1.5;
            min-height: 60px;
            white-space: pre-line;
        }

        .price-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,243,255,.05);
            border: 1px solid rgba(0,243,255,.2);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .price-amount {
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), #00a8ff);
            color: #060608;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: .95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history-btn {
            width: 100%;
            background: rgba(255,255,255,.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,.2);
            border-top-color: #060608;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        /* CSS Notification */
        .notification-container {
            position: fixed;
            top: 20px;
            left: 16px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .notification {
            width: min(100%, 420px);
            background: rgba(12, 12, 18, .94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,.45);
            transform: translateY(-25px);
            opacity: 0;
            transition: opacity .3s ease, transform .3s ease;
            pointer-events: auto;
            overflow: hidden;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .notification.hide {
            opacity: 0;
            transform: translateY(-25px);
        }

        .notification-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 800;
        }

        .notification.success {
            border-color: rgba(0,255,136,.25);
        }

        .notification.success .notification-icon {
            background: rgba(0,255,136,.12);
            color: var(--stock-green);
        }

        .notification.error {
            border-color: rgba(255,75,75,.3);
        }

        .notification.error .notification-icon {
            background: rgba(255,75,75,.12);
            color: #ff4b4b;
        }

        .notification.info {
            border-color: rgba(0,243,255,.25);
        }

        .notification.info .notification-icon {
            background: rgba(0,243,255,.12);
            color: var(--neon-cyan);
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-size: .82rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 3px;
        }

        .notification-message {
            font-size: .78rem;
            color: #a0aec0;
            line-height: 1.4;
        }

        .notification-close {
            background: transparent;
            border: none;
            color: #718096;
            font-size: 1.15rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .notification-close:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<!-- CSS Notification Container -->
<div id="notification-container" class="notification-container"></div>

<header>
    <button class="back-btn" onclick="history.back()" aria-label="Go Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    <div class="page-title">SMM Social Boost</div>
</header>

<div class="smm-card">
    <div class="balance-badge">
        <span style="font-size: .85rem; color: #a0aec0;">Your Wallet Balance:</span>
        <span class="balance-amount" id="user-balance">₦0.00</span>
    </div>

    <form id="smm-form">
        <div class="form-group">
            <label class="form-label" for="category-select">Category</label>
            <select id="category-select" class="form-control">
                <option value="">Loading categories...</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="service-select">Service</label>
            <select id="service-select" class="form-control" disabled>
                <option value="">Select a category first</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Description</label>
            <div id="service-description" class="description-box">Select a service to view details.</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="link-input">Target Link</label>
            <input type="url" id="link-input" class="form-control" placeholder="https://instagram.com/username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="quantity-input">Quantity</label>
            <input type="number" id="quantity-input" class="form-control" placeholder="Min: 100" required disabled>
            <div id="quantity-hint" style="font-size: .75rem; color: #718096; margin-top: 4px;"></div>
        </div>

        <div class="price-badge">
            <span style="font-size: .85rem; color: #a0aec0;">Total Charge:</span>
            <span class="price-amount" id="total-price">₦0.00</span>
        </div>

        <button type="submit" id="submit-order" class="submit-btn" disabled>Submit Order</button>
    </form>
</div>

<a href="smmhistory.html" class="history-btn">View Order History</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, onSnapshot, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB4X-pWsM2Z66tMZEOfH7A7KNIRBb-yPLk",
        authDomain: "primelogs-web.firebaseapp.com",
        projectId: "primelogs-web",
        storageBucket: "primelogs-web.firebasestorage.app",
        messagingSenderId: "732956069251",
        appId: "1:732956069251:web:b9c8be37e6db4f98db3ab3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const API_URL = "https://pr1m-l0gs-website-smmboosting.up.railway.app/api/smm";
    const MARGIN_MULTIPLIER = 3.0;
    const NGN_RATE = 1;

    let currentUser = null;
    let currentUserBalance = 0;
    let selectedService = null;
    let unsubscribeBalance = null;

    const serviceMap = new Map();
    const servicesByCategory = new Map();

    const userBalanceDisplay = document.getElementById('user-balance');
    const categorySelect = document.getElementById('category-select');
    const serviceSelect = document.getElementById('service-select');
    const serviceDescription = document.getElementById('service-description');
    const quantityInput = document.getElementById('quantity-input');
    const quantityHint = document.getElementById('quantity-hint');
    const totalPriceDisplay = document.getElementById('total-price');
    const submitBtn = document.getElementById('submit-order');
    const smmForm = document.getElementById('smm-form');
    const notificationContainer = document.getElementById('notification-container');

    // ============================================================
    // CSS NOTIFICATION SYSTEM
    // ============================================================

    function showNotification(message, type = 'info', title = '') {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;

        let icon = 'ⓘ';
        let defaultTitle = 'Notice';

        if (type === 'success') {
            icon = '✓';
            defaultTitle = 'Success';
        } else if (type === 'error') {
            icon = '!';
            defaultTitle = 'Error';
        }

        notification.innerHTML = `
            <div class="notification-icon">${icon}</div>
            <div class="notification-content">
                <div class="notification-title">${title || defaultTitle}</div>
                <div class="notification-message">${message}</div>
            </div>
            <button class="notification-close" aria-label="Close notification">×</button>
        `;

        notificationContainer.appendChild(notification);

        const closeBtn = notification.querySelector('.notification-close');

        const removeNotification = () => {
            notification.classList.remove('show');
            notification.classList.add('hide');

            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        };

        closeBtn.addEventListener('click', removeNotification);

        requestAnimationFrame(() => {
            notification.classList.add('show');
        });

        setTimeout(removeNotification, 3500);
    }

    // ============================================================
    // AUTHENTICATION
    // ============================================================

    onAuthStateChanged(auth, (user) => {
        if (!user) { 
            window.location.href = "index.html"; 
            return; 
        }

        currentUser = user;

        setupRealtimeBalance();
        loadServices();
    });

    // ============================================================
    // REALTIME BALANCE
    // ============================================================

    function setupRealtimeBalance() {
        if (unsubscribeBalance) unsubscribeBalance();
        
        const userRef = doc(db, "users", currentUser.uid);

        unsubscribeBalance = onSnapshot(userRef, (docSnap) => {
            if (docSnap.exists()) {
                currentUserBalance = docSnap.data()?.balance || 0;

                userBalanceDisplay.textContent =
                    `₦${currentUserBalance.toLocaleString(undefined, {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}`;
            } else {
                currentUserBalance = 0;
                userBalanceDisplay.textContent = "₦0.00";
            }
        }, (err) => {
            console.error("Balance listener error:", err);
            userBalanceDisplay.textContent = "₦0.00";
        });
    }

    // ============================================================
    // LOAD SERVICES
    // ============================================================

    async function loadServices() {
        try {
            const res = await fetch(`${API_URL}/services`);
            const services = await res.json();
            
            servicesByCategory.clear();
            serviceMap.clear();

            const fragment = document.createDocumentFragment();

            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "Select Category";
            fragment.appendChild(defaultOption);

            services.forEach(service => {
                const sId = String(service.service);

                serviceMap.set(sId, service);

                if (!servicesByCategory.has(service.category)) {
                    servicesByCategory.set(service.category, []);

                    const catOption = document.createElement('option');
                    catOption.value = service.category;
                    catOption.textContent = service.category;

                    fragment.appendChild(catOption);
                }

                servicesByCategory.get(service.category).push(service);
            });

            categorySelect.innerHTML = "";
            categorySelect.appendChild(fragment);

        } catch (err) {
            console.error("Service load error:", err);

            categorySelect.innerHTML =
                '<option value="">Error loading services</option>';
        }
    }

    // ============================================================
    // CATEGORY SELECTION
    // ============================================================

    categorySelect.addEventListener('change', () => {
        const cat = categorySelect.value;

        if (!cat) {
            serviceSelect.disabled = true;
            serviceSelect.innerHTML =
                '<option value="">Select a category first</option>';

            serviceDescription.textContent =
                'Select a service to view details.';

            resetQuantityAndPrice();
            return;
        }

        const categoryServices =
            servicesByCategory.get(cat) || [];

        const fragment =
            document.createDocumentFragment();

        const defaultOption =
            document.createElement('option');

        defaultOption.value = "";
        defaultOption.textContent = "Select Service";

        fragment.appendChild(defaultOption);

        categoryServices.forEach(s => {
            const markedUpRate =
                (parseFloat(s.rate) *
                MARGIN_MULTIPLIER *
                NGN_RATE).toFixed(2);

            const opt =
                document.createElement('option');

            opt.value = s.service;

            opt.textContent =
                `${s.name} - NGN ${markedUpRate} per 1000`;

            fragment.appendChild(opt);
        });

        serviceSelect.disabled = false;
        serviceSelect.innerHTML = "";
        serviceSelect.appendChild(fragment);

        resetQuantityAndPrice();
    });

    // ============================================================
    // SERVICE SELECTION
    // ============================================================

    serviceSelect.addEventListener('change', () => {
        const serviceId = String(serviceSelect.value);

        selectedService =
            serviceMap.get(serviceId);
        
        if (selectedService) {
            quantityInput.disabled = false;

            quantityInput.min =
                selectedService.min;

            quantityInput.max =
                selectedService.max;

            quantityHint.textContent =
                `Min: ${selectedService.min} | Max: ${selectedService.max}`;
            
            const ratePer1000 =
                parseFloat(selectedService.rate);

            const markedUpRate =
                (ratePer1000 *
                MARGIN_MULTIPLIER *
                NGN_RATE).toFixed(2);
            
            const desc =
                selectedService.description ||
                selectedService.name;

            serviceDescription.innerHTML =
                `<div><strong>${selectedService.name}</strong> - NGN ${markedUpRate} per 1000</div>
                <br>
                <div>${desc}</div>`;

            calculatePrice();

        } else {
            resetQuantityAndPrice();
        }
    });

    quantityInput.addEventListener(
        'input',
        calculatePrice
    );

    // ============================================================
    // RESET PRICE
    // ============================================================

    function resetQuantityAndPrice() {
        selectedService = null;

        quantityInput.value = "";
        quantityInput.disabled = true;

        quantityHint.textContent = "";

        totalPriceDisplay.textContent =
            '₦0.00';

        submitBtn.disabled = true;
    }

    // ============================================================
    // CALCULATE PRICE
    // ============================================================

    function calculatePrice() {
        if (!selectedService || !quantityInput.value) {
            totalPriceDisplay.textContent =
                '₦0.00';

            submitBtn.disabled = true;
            return;
        }

        const qty =
            parseInt(quantityInput.value, 10) || 0;

        const min =
            parseInt(selectedService.min, 10);

        const max =
            parseInt(selectedService.max, 10);

        if (qty < min || qty > max) {
            submitBtn.disabled = true;
            return;
        }

        const ratePer1000 =
            parseFloat(selectedService.rate);

        const totalNGN =
            ((ratePer1000 / 1000) * qty) *
            MARGIN_MULTIPLIER *
            NGN_RATE;

        totalPriceDisplay.textContent =
            `₦${totalNGN.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            })}`;

        submitBtn.disabled = false;
    }

    // ============================================================
    // SUBMIT ORDER
    // ============================================================

    smmForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML =
            '<div class="spinner"></div>';

        const qty =
            parseInt(quantityInput.value, 10);

        const link =
            document.getElementById('link-input')
            .value.trim();

        try {
            const ratePer1000 =
                parseFloat(selectedService.rate);

            const totalNGN =
                ((ratePer1000 / 1000) * qty) *
                MARGIN_MULTIPLIER *
                NGN_RATE;

            // ====================================================
            // INSUFFICIENT BALANCE
            // ====================================================

            if (currentUserBalance < totalNGN) {
                showNotification(
                    "Your wallet balance is not enough for this order.",
                    "error",
                    "Insufficient Balance"
                );

                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Order";

                return;
            }

            // ====================================================
            // SEND ORDER TO PROVIDER
            // ====================================================

            const apiRes = await fetch(
                `${API_URL}/order`,
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        service: selectedService.service,
                        link: link,
                        quantity: qty
                    })
                }
            );

            const orderResult =
                await apiRes.json();

            // ====================================================
            // SUCCESS
            // ====================================================

            if (orderResult.order) {

                const userRef =
                    doc(db, "users", currentUser.uid);

                await updateDoc(userRef, {
                    balance: increment(-totalNGN)
                });

                // Save to smmOrders so the Telegram bot
                // and SMM History page can receive/read it.
                await addDoc(
                    collection(db, "smmOrders"),
                    {
                        userId: currentUser.uid,
                        smmOrderId: orderResult.order,
                        serviceId: selectedService.service,
                        serviceName: selectedService.name,
                        category: selectedService.category || "N/A",
                        link: link,
                        quantity: qty,
                        totalPaid: totalNGN,
                        charge: totalNGN,
                        status: 'Pending',
                        createdAt: serverTimestamp()
                    }
                );

                showNotification(
                    "Your SMM boosting order has been placed successfully.",
                    "success",
                    "Order Placed"
                );

                setTimeout(() => {
                    window.location.href =
                        "smmhistory.html";
                }, 1200);

            } else {

                showNotification(
                    orderResult.error ||
                    "The provider could not process your order.",
                    "error",
                    "Order Failed"
                );

            }

        } catch (err) {

            console.error(err);

            showNotification(
                "Something went wrong while processing your order. Please try again.",
                "error",
                "Transaction Failed"
            );

        } finally {

            submitBtn.disabled = false;
            submitBtn.textContent =
                "Submit Order";
        }
    });
</script>

</body>
</html>
